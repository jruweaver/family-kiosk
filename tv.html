<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Dashboard TV</title>
<!--
  Family Command Center — TV view (view only).
  Upload next to index.html. Same pairing as the kiosk: open once as
  tv.html?api=<web app /exec link>&key=<pairing key>; it's saved on that device.
  It only ever calls getDashboardData / getMedia — it can't change anything.
  Options: ?saver=1 (screensaver: slow drift against burn-in), ?demo=1 (sample data).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="DEFAULT"] { --bg:#0E2320; --bg-glow:#12352F; --surface:#16302C; --surface-2:#1E3D38; --line:#2F5A52; --text:#EAF7F2; --muted:#9DBDB4; --faint:#6E9188; --accent:#5EE6B5; --coin:#F5C451; --flame:#FF8A4C; --ok:#5EE6B5; --warn:#FFC864; --danger:#FF6B6B; }
  [data-theme="HALLOWEEN"] { --bg:#1A1020; --bg-glow:#2A1630; --surface:#24162B; --surface-2:#2F1D37; --line:#4A2F55; --text:#FBEFE3; --muted:#C7A9BD; --faint:#8E7088; --accent:#FF8A3D; --coin:#FFC94D; --flame:#FF5E3A; --ok:#9BE15D; --warn:#FFC94D; --danger:#FF5C7A; }
  [data-theme="DARK"] { --bg:#14171C; --bg-glow:#1C2129; --surface:#1B1F26; --surface-2:#232832; --line:#363D4A; --text:#E8ECF2; --muted:#A3ACBA; --faint:#6F7889; --accent:#7AA7FF; --coin:#F2C14E; --flame:#FF8752; --ok:#6BD69B; --warn:#F2C14E; --danger:#FF6B6B; }
  [data-theme="OCEAN"] { --bg:#0B2236; --bg-glow:#0F3049; --surface:#102C44; --surface-2:#163852; --line:#255474; --text:#E6F6FF; --muted:#9CC4DA; --faint:#6A93AA; --accent:#3DD6D0; --coin:#FFD166; --flame:#FF8C69; --ok:#5EEAD4; --warn:#FFD166; --danger:#FF7A8A; }
  [data-theme="HOLIDAY"] { --bg:#10261C; --bg-glow:#163424; --surface:#163224; --surface-2:#1D3E2D; --line:#2F5C44; --text:#FFF8EC; --muted:#C9D8C2; --faint:#8DA58F; --accent:#F2545B; --coin:#F7C948; --flame:#FF8F4D; --ok:#7BD88F; --warn:#F7C948; --danger:#FF6B6B; }
  [data-theme="ARCADE"] { --bg:#120E2A; --bg-glow:#1D1442; --surface:#1A1438; --surface-2:#231B4A; --line:#3B2F75; --text:#F3F0FF; --muted:#B5ACE0; --faint:#7D73AE; --accent:#FF4FD8; --coin:#FFE14D; --flame:#FF7A3D; --ok:#5CFF9D; --warn:#FFE14D; --danger:#FF5C7A; }

  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text); cursor:none; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body { font-family:'Atkinson Hyperlegible', system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  .num { font-variant-numeric: tabular-nums; }
  h1, h2, h3, .display { font-family:'Bricolage Grotesque', 'Atkinson Hyperlegible', sans-serif; margin:0; }

  /* Designed at 1920×1080 and scaled to whatever the TV reports. */
  #wrap { position:fixed; left:0; top:0; width:100vw; height:100vh; overflow:hidden; }
  #stage { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0;
    background: radial-gradient(1200px 700px at 15% -10%, var(--bg-glow), transparent 70%), var(--bg);
    padding:44px 72px 36px; box-sizing:border-box; display:grid; grid-template-rows:auto 1fr auto; gap:28px;
    transition: translate 4s ease; }

  header { display:flex; align-items:flex-end; justify-content:space-between; }
  .clock { font-size:112px; line-height:.9; font-weight:700; letter-spacing:-2px; }
  .clock small { font-size:40px; margin-left:10px; color:var(--muted); font-weight:600; letter-spacing:0; }
  .date { font-size:36px; color:var(--muted); margin-top:10px; }
  .weather { display:flex; align-items:center; gap:16px; font-size:72px; font-weight:700; }
  .weather img { width:92px; height:92px; }
  .weather .ico { font-size:72px; }

  main { display:grid; grid-template-columns: 1fr 520px; gap:28px; min-height:0; }
  #kids { display:grid; gap:28px; min-height:0; }
  .kid { background:var(--surface); border:3px solid var(--line); border-radius:32px; padding:28px 30px; display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  .kid.complete { border-color:var(--ok); box-shadow:0 0 0 6px color-mix(in srgb, var(--ok) 18%, transparent), 0 0 60px color-mix(in srgb, var(--ok) 25%, transparent); }
  .kid-head { display:flex; align-items:center; gap:22px; }
  .avatar { flex:none; width:96px; height:96px; border-radius:50%; background:var(--kid); color:#0b0f14; display:grid; place-items:center; font:800 48px 'Bricolage Grotesque', sans-serif; overflow:hidden; }
  .avatar img { width:100%; height:100%; object-fit:cover; }
  .kid-name { font-size:52px; font-weight:800; line-height:1; }
  .kid-room { font-size:28px; color:var(--muted); margin-top:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stats { margin-left:auto; text-align:right; font-size:30px; line-height:1.35; }
  .stats .coin { color:var(--coin); font-weight:700; }
  .stats .flame { color:var(--flame); font-weight:700; }
  .bar { height:16px; border-radius:99px; background:var(--surface-2); margin:22px 0 18px; overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:99px; background:var(--kid); }
  .kid.complete .bar i { background:var(--ok); }
  .count { font-size:30px; color:var(--muted); margin:-6px 0 10px; }
  .count b { color:var(--text); font-size:38px; }
  ul.chores { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; min-height:0; }
  .chore { display:flex; align-items:center; gap:18px; font-size:34px; line-height:1.15; padding:8px 4px; }
  .chore .box { flex:none; width:42px; height:42px; border-radius:50%; border:4px solid var(--faint); display:grid; place-items:center; font-size:26px; font-weight:800; color:var(--bg); }
  .chore .ico { flex:none; width:44px; text-align:center; font-size:34px; }
  .chore .ico img { width:44px; height:44px; object-fit:contain; vertical-align:middle; }
  .chore .t { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:700; }
  .chore .w { flex:none; font-size:24px; color:var(--faint); }
  .chore.done { color:var(--faint); }
  .chore.done .t { font-weight:400; text-decoration:line-through; text-decoration-thickness:2px; }
  .chore.done .box { background:var(--ok); border-color:var(--ok); }
  .chore.locked { color:var(--faint); }
  .chore.missed .t { color:var(--danger); }
  .more { font-size:28px; color:var(--muted); padding:4px 4px 0 64px; }
  .banner { margin-top:auto; padding:22px 26px; border-radius:22px; font-size:40px; font-weight:800; text-align:center; font-family:'Bricolage Grotesque', sans-serif; }
  .banner.ok { background:color-mix(in srgb, var(--ok) 22%, var(--surface)); color:var(--ok); }
  .banner.rest { background:var(--surface-2); color:var(--muted); }
  .banner.warn { background:color-mix(in srgb, var(--warn) 18%, var(--surface)); color:var(--warn); }

  aside { display:flex; flex-direction:column; gap:18px; min-height:0; overflow:hidden; }
  .card { background:var(--surface); border:3px solid var(--line); border-radius:28px; padding:20px 26px; flex:none; }
  .card h3 { font-size:24px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:10px; }
  .ev { display:flex; gap:16px; font-size:32px; padding:4px 0; align-items:baseline; }
  .ev .tm { flex:none; width:136px; color:var(--accent); font-weight:700; font-size:28px; }
  .ev .tt { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ev .dot { flex:none; width:14px; height:14px; border-radius:50%; background:var(--evc, var(--accent)); align-self:center; }
  .empty { font-size:30px; color:var(--faint); }
  .cd { display:flex; align-items:center; gap:24px; }
  .cd .big { font-size:84px; font-weight:800; line-height:.9; color:var(--accent); font-family:'Bricolage Grotesque', sans-serif; }
  .cd .big small { display:block; font-size:26px; color:var(--muted); font-weight:600; text-align:center; }
  .cd .nm { font-size:36px; font-weight:700; line-height:1.15; }
  .cd .dt { font-size:26px; color:var(--muted); margin-top:4px; }
  .cd-next { font-size:28px; color:var(--muted); margin-top:12px; }
  .cd-next b { color:var(--text); }
  .meal { font-size:30px; color:var(--muted); margin-top:12px; padding-top:12px; border-top:2px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meal b { color:var(--text); }
  .note { font-size:34px; line-height:1.3; white-space:pre-wrap; overflow:hidden; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; }
  .card.note-card { border-color:color-mix(in srgb, var(--coin) 60%, var(--line)); flex:1 1 auto; min-height:0; overflow:hidden; }
  .card.rw-card { border-color:color-mix(in srgb, var(--warn) 70%, var(--line)); background:color-mix(in srgb, var(--warn) 8%, var(--surface)); }
  .card.rw-card h3 { color:var(--warn); }
  .rw { display:flex; gap:14px; font-size:30px; padding:4px 0; align-items:baseline; }
  .rw .who { flex:none; font-weight:800; }
  .rw .what { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rw .when { flex:none; font-size:24px; color:var(--muted); }

  /* 4+ people: smaller cards */
  #kids.compact .kid { padding:22px 22px; border-radius:26px; }
  #kids.compact .kid-head { gap:14px; }
  #kids.compact .avatar { width:68px; height:68px; font-size:34px; }
  #kids.compact .kid-name { font-size:38px; }
  #kids.compact .kid-room { font-size:22px; }
  #kids.compact .stats { font-size:22px; }
  #kids.compact .bar { height:12px; margin:16px 0 12px; }
  #kids.compact .count { font-size:24px; margin:-4px 0 6px; }
  #kids.compact .count b { font-size:30px; }
  #kids.compact .chore { font-size:26px; gap:12px; padding:5px 2px; }
  #kids.compact .chore .box { width:32px; height:32px; border-width:3px; font-size:20px; }
  #kids.compact .chore .ico { width:32px; font-size:26px; }
  #kids.compact .chore .ico img { width:32px; height:32px; }
  #kids.compact .chore .w { font-size:20px; }
  #kids.compact .more { font-size:22px; padding-left:46px; }
  #kids.compact .banner { font-size:28px; padding:16px 18px; }
  #kids.compact ul.chores { gap:4px; }
  footer { display:flex; justify-content:space-between; font-size:22px; color:var(--faint); }
  footer .off { color:var(--warn); }

  #msg { position:absolute; inset:0; display:none; place-items:center; text-align:center; padding:80px; box-sizing:border-box; }
  #msg.on { display:grid; }
  #msg h2 { font-size:64px; margin-bottom:24px; }
  #msg p { font-size:34px; color:var(--muted); max-width:1300px; line-height:1.4; margin:0 auto; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <header>
    <div><div class="clock num" id="clock"></div><div class="date" id="date"></div></div>
    <div class="weather num" id="weather"></div>
  </header>
  <main>
    <section id="kids"></section>
    <aside id="side"></aside>
  </main>
  <footer><span id="hint"></span><span id="updated"></span></footer>
  <div id="msg"><div><h2 id="msgTitle"></h2><p id="msgText"></p></div></div>
</div></div>
<script>
(function () {
  'use strict';
  var CFG_KEY = 'fcc.api.v1', SNAP_KEY = 'fcc.tv.snapshot';
  var REFRESH_MS = 2 * 60 * 1000;
  var KID_COLORS = ['#5EC8FF', '#FF8FB1', '#FFD166', '#7BE495', '#C3A6FF', '#FF9F5A'];
  var q = new URLSearchParams(location.search);
  var SAVER = q.get('saver') === '1', DEMO = q.get('demo') === '1';
  var S = { data: null, at: 0, offline: false, media: {}, mediaLoading: {} };

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function n(v) { return Number(v || 0).toLocaleString('en-US'); }
  function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ignore */ } }
  function load(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }

  /* ---------- pairing (same storage as the kiosk) ---------- */
  if (q.get('api') && q.get('key')) {
    store(CFG_KEY, { url: q.get('api').trim(), key: q.get('key').trim() });
    q.delete('api'); q.delete('key');
    try { history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '')); } catch (e) { /* ignore */ }
  }

  /* Read-only API: only these two functions are ever called. */
  var READ_ONLY = { getDashboardData: 1, getMedia: 1 };
  function call(fn, args) {
    if (!READ_ONLY[fn]) return Promise.reject(new Error('not allowed'));
    var cfg = load(CFG_KEY);
    if (!cfg || !cfg.url || !cfg.key) return Promise.reject({ unpaired: true });
    return fetch(cfg.url, {
      method: 'POST', redirect: 'follow', credentials: 'omit',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, args: args || [], key: cfg.key })
    }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (out) {
        if (out && (out.code === 'BAD_KEY' || out.code === 'NO_KEY')) throw { unpaired: true };
        if (out && out.error && out.code) throw new Error(out.error);
        return out;
      });
  }

  /* ---------- time ---------- */
  function tz() { return (S.data && S.data.settings && S.data.settings.timeZone) || undefined; }
  function pad(v) { return ('0' + v).slice(-2); }
  function now() {
    var d = new Date(), p = {};
    try {
      new Intl.DateTimeFormat('en-US', { timeZone: tz(), year: 'numeric', month: '2-digit', day: '2-digit', hour: 'numeric', minute: '2-digit', hourCycle: 'h23' })
        .formatToParts(d).forEach(function (x) { p[x.type] = x.value; });
    } catch (e) { p = { year: d.getFullYear(), month: pad(d.getMonth() + 1), day: pad(d.getDate()), hour: d.getHours(), minute: pad(d.getMinutes()) }; }
    var h = Number(p.hour) % 24;
    return { key: p.year + '-' + p.month + '-' + p.day, h: h, time: ((h % 12) || 12) + ':' + p.minute, ampm: h < 12 ? 'AM' : 'PM' };
  }
  function prettyDate(key, opts) {
    var p = key.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('en-US', opts || { weekday: 'long', month: 'long', day: 'numeric' });
  }
  function clockTick() {
    var t = now();
    $('clock').innerHTML = esc(t.time) + '<small>' + t.ampm + '</small>';
    $('date').textContent = prettyDate(t.key);
    if (S.data && S.day && S.day !== t.key) refresh();   // new day
    S.day = t.key;
  }

  /* ---------- pictures (media:… keys come from the sheet) ---------- */
  function pic(v) {
    v = String(v || '');
    if (/^https?:\/\//i.test(v)) return v;
    if (!/^media:[A-Za-z0-9_-]+$/.test(v) || DEMO) return '';
    if (S.media[v]) return S.media[v];
    if (!S.mediaLoading[v]) {
      S.mediaLoading[v] = 1;
      call('getMedia', [v]).then(function (r) {
        if (r && r.data) { S.media[v] = 'data:' + (r.mime || 'image/png') + ';base64,' + r.data; render(); }
      }).catch(function () { /* keep the initial */ });
    }
    return '';
  }
  function icon(v, fallback) {
    var u = pic(v);
    if (u) return '<img src="' + esc(u) + '" alt="">';
    return esc(v && !/^media:/.test(v) && !/^https?:/i.test(v) ? v : fallback);
  }

  /* ---------- render ---------- */
  function choreState(c) {
    if (c.completed || c.status === 'completed_by_me') return 'done';
    if (c.teamState) return 'team'; // a teammate did it: "did you help?" is answered on the kiosk
    return c.status; // available | upcoming | expired
  }
  function kidCard(u, i, rows, compact) {
    var t = u.today || {}, p = t.progress || { done: 0, total: 0, percent: 0 };
    var color = u.color || KID_COLORS[i % KID_COLORS.length];
    var list = (t.chores || []).concat(t.weekly || [], t.quests || []);
    // To-do first, then later/missed, then done — what's left is what matters from the couch.
    var order = { available: 0, upcoming: 1, expired: 2, team: 3, done: 4 };
    list = list.slice().sort(function (a, b) { return (order[choreState(a)] || 0) - (order[choreState(b)] || 0); });
    var complete = t.dayComplete && !t.isRestDay && (!p.total || p.done >= p.total);
    // Small cards: only what's left (the count shows the rest).
    if (compact) list = list.filter(function (c) { return choreState(c) !== 'done'; });
    if (complete) rows = compact ? 0 : Math.min(rows, 6);
    var av = pic(u.profilePicture);
    var html = '<div class="kid' + (complete ? ' complete' : '') + '" style="--kid:' + esc(color) + '">' +
      '<div class="kid-head"><div class="avatar">' + (av ? '<img src="' + esc(av) + '" alt="">' : esc((u.name || '?').charAt(0))) + '</div>' +
      '<div style="min-width:0"><div class="kid-name">' + esc(u.name) + (u.isBirthday ? ' 🎂' : '') + '</div>' +
      '<div class="kid-room">' + esc(t.displayRoom || '') + '</div></div>' +
      '<div class="stats num"><div class="coin">🪙 ' + n(u.wallet) + '</div><div class="flame">🔥 ' + n(u.streak) + '</div></div></div>' +
      '<div class="bar"><i style="width:' + (t.isRestDay ? 100 : (p.percent || 0)) + '%"></i></div>';
    if (!t.isRestDay && p.total) html += '<div class="count num"><b>' + p.done + '</b> of ' + p.total + ' done</div>';
    if (list.length && rows > 0) {
      var shown = list.slice(0, rows);
      html += '<ul class="chores">' + shown.map(function (c) {
        var st = choreState(c);
        var w = st === 'upcoming' ? (c.availabilityLabel || 'Later') : st === 'expired' ? 'Missed'
          : st === 'team' ? '🤝 ' + (c.teamDoneBy || 'Team') + (c.teamState === 'declined' ? ' did it' : ' did it · helped?') : '';
        return '<li class="chore ' + (st === 'done' ? 'done' : st === 'upcoming' || st === 'team' ? 'locked' : st === 'expired' ? 'missed' : '') + '">' +
          '<span class="box">' + (st === 'done' ? '✓' : '') + '</span><span class="ico">' + icon(c.icon, '🧹') + '</span>' +
          '<span class="t">' + esc(c.task) + '</span>' + (w ? '<span class="w">' + esc(w) + '</span>' : '') + '</li>';
      }).join('') + '</ul>';
      if (list.length > rows) html += '<div class="more">+' + (list.length - rows) + ' more</div>';
    }
    if (complete) html += '<div class="banner ok">🏆 All done! Great job, ' + esc(u.name) + '!</div>';
    else if (t.isRestDay) html += '<div class="banner rest">🎉 Free day — nothing scheduled</div>';
    else if (t.needsSelection) html += '<div class="banner warn">Needs to pick an area on the kiosk</div>';
    return html + '</div>';
  }

  function currentMeal() {
    var m = S.data.meals && S.data.meals.today && S.data.meals.today.meals;
    if (!m) return null;
    var h = now().h;
    var order = h < 10 ? ['Breakfast', 'Lunch', 'Dinner'] : h < 14 ? ['Lunch', 'Dinner', 'Breakfast'] : ['Dinner', 'Lunch', 'Breakfast'];
    for (var i = 0; i < order.length; i++) if (String(m[order[i]] || '').trim()) return { label: order[i], text: String(m[order[i]]).trim() };
    return null;
  }

  function render() {
    var d = S.data;
    if (!d) return;
    var s = d.settings || {};
    var theme = String(s.theme || 'DEFAULT').toUpperCase();
    document.documentElement.setAttribute('data-theme', /^(DEFAULT|HALLOWEEN|DARK|OCEAN|HOLIDAY|ARCADE)$/.test(theme) ? theme : 'DEFAULT');

    var w = d.weather;
    $('weather').innerHTML = w && w.temperature != null
      ? (w.iconUrl ? '<img src="' + esc(w.iconUrl) + '" alt="">' : '<span class="ico">' + esc(w.icon || '') + '</span>') + '<span>' + esc(w.temperature) + esc(w.unit || '°') + '</span>'
      : '';

    // People with something on today (adults without chores stay off the TV).
    var people = (d.users || []).filter(function (u) {
      var t = u.today || {};
      return t.isRestDay || t.needsSelection || ((t.chores || []).length + (t.weekly || []).length + (t.quests || []).length) > 0;
    });
    if (!people.length) people = d.users || [];
    var cnt = Math.max(people.length, 1);
    var cols = cnt <= 3 ? cnt : cnt === 4 ? 2 : 3;
    var kidRows = Math.ceil(cnt / cols);
    var compact = kidRows > 1;
    $('kids').classList.toggle('compact', compact);
    $('kids').style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    $('kids').style.gridTemplateRows = 'repeat(' + kidRows + ', 1fr)';
    var rows = compact ? 3 : 9;
    $('kids').innerHTML = people.map(function (u) { return kidCard(u, (d.users || []).indexOf(u), rows, compact); }).join('');

    // Side panel: today → coming up → meal → message board.
    var today = now().key, side = '';
    var meal = currentMeal();
    var evs = (d.events || []).filter(function (e) { return e.startStr <= today && e.endStr >= today; });
    side += '<div class="card"><h3>Today</h3>' + (evs.length ? evs.slice(0, 5).map(function (e) {
      return '<div class="ev" style="--evc:' + esc(e.color || '') + '"><span class="dot"></span><span class="tm">' + (e.allDay ? 'All day' : esc(String(e.timeLabel || '').replace(':00 ', ' '))) + '</span><span class="tt">' + esc(e.title) + '</span></div>';
    }).join('') + (evs.length > 5 ? '<div class="empty">+' + (evs.length - 5) + ' more</div>' : '') : '<div class="empty">Nothing on the calendar</div>') +
      (meal ? '<div class="meal">🍽️ ' + esc(meal.label) + ': <b>' + esc(meal.text) + '</b></div>' : '') + '</div>';

    var cds = (d.countdowns || []).filter(function (c) { return c.daysUntil >= 0; });
    if (cds.length) {
      var c = cds[0];
      side += '<div class="card"><h3>Coming up</h3><div class="cd"><div class="big num">' + (c.daysUntil === 0 ? 'Today' : c.daysUntil + '<small>' + (c.daysUntil === 1 ? 'day' : 'days') + '</small>') + '</div>' +
        '<div style="min-width:0"><div class="nm">' + esc(c.name) + '</div><div class="dt">' + esc(prettyDate(c.dateStr, { weekday: 'long', month: 'short', day: 'numeric' })) + '</div></div></div>' +
        cds.slice(1, 3).map(function (x) { return '<div class="cd-next"><b class="num">' + (x.daysUntil === 1 ? 'Tomorrow' : x.daysUntil + ' days') + '</b> · ' + esc(x.name) + '</div>'; }).join('') + '</div>';
    }
    // Rewards waiting for a parent to approve (newer backends send the list; older ones: from each statement).
    var waiting = d.pendingRewards;
    if (!waiting) {
      waiting = [];
      (d.users || []).forEach(function (u) {
        (u.recentTransactions || []).forEach(function (t) { if (t.status === 'pending') waiting.push({ member: u.name, reward: t.description, when: t.date }); });
      });
    }
    if (waiting.length) {
      var maxRw = String(s.bulletin || '').trim() ? 3 : 5;
      side += '<div class="card rw-card"><h3>🎁 Waiting for approval · ' + waiting.length + '</h3>' + waiting.slice(0, maxRw).map(function (r) {
        return '<div class="rw"><span class="who">' + esc(r.member) + '</span><span class="what">' + esc(r.reward) + (r.secret ? ' 🔐' : '') + '</span><span class="when">' + esc(r.when || '') + '</span></div>';
      }).join('') + (waiting.length > maxRw ? '<div class="empty">+' + (waiting.length - maxRw) + ' more</div>' : '') + '</div>';
    }
    var note = String(s.bulletin || '').trim();
    if (note) side += '<div class="card note-card"><h3>📌 Message board</h3><div class="note">' + esc(note) + '</div></div>';
    $('side').innerHTML = side;
    fitNote();

    var t = new Date(S.at).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: tz() });
    $('updated').innerHTML = S.offline ? '<span class="off">⚠ Offline — showing ' + esc(t) + ' data</span>' : 'Updated ' + esc(t);
    if (q.get('debug') !== '1') $('hint').textContent = SAVER ? '' : 'Press Back to close';
    hideMsg();
  }

  /* Message board: as many whole lines as the space left over allows (never a half-cut line). */
  function fitNote() {
    var card = document.querySelector('.note-card');
    if (!card) return;
    var note = card.querySelector('.note');
    var room = card.clientHeight - card.querySelector('h3').offsetHeight - 50;
    var sizes = [34, 30, 26, 22];
    for (var i = 0; i < sizes.length; i++) {
      // Smaller text before cutting the message off: stop at the first size where it all fits.
      note.style.fontSize = sizes[i] + 'px';
      note.style.webkitLineClamp = 'unset'; note.style.maxHeight = 'none';
      var lh = sizes[i] * 1.3;
      var need = Math.round(note.scrollHeight / lh);
      var lines = Math.max(1, Math.min(4, Math.floor(room / lh)));
      if (need <= lines || i === sizes.length - 1) {
        note.style.webkitLineClamp = String(lines);
        note.style.maxHeight = (lines * lh) + 'px';
        break;
      }
    }
  }

  function showMsg(title, text) { $('msgTitle').textContent = title; $('msgText').textContent = text; $('msg').classList.add('on'); }
  function hideMsg() { $('msg').classList.remove('on'); }

  function refresh() {
    if (DEMO) { S.data = demoData(); S.at = Date.now(); render(); return; }
    call('getDashboardData').then(function (r) {
      S.data = r; S.at = Date.now(); S.offline = false;
      store(SNAP_KEY, { at: S.at, data: r });
      render();
    }).catch(function (e) {
      if (e && e.unpaired) { showMsg('This TV isn\'t paired yet', 'On the laptop, put the kiosk\'s pairing link in pairing.txt and run 5-install-dashboard.bat again.'); return; }
      S.offline = true;
      if (S.data) render();
      else showMsg('Can\'t reach the house data', 'Check the Shield\'s internet connection. Trying again in 2 minutes.');
    });
  }

  /* ---------- fit 1920×1080 to the screen; drift in screensaver mode ---------- */
  /* Some TV web views report the page's own 1920px width as the window width,
     so take the smallest believable size from every source. */
  function viewSize() {
    var W = [innerWidth, document.documentElement.clientWidth, screen.width, window.visualViewport && visualViewport.width];
    var H = [innerHeight, document.documentElement.clientHeight, screen.height, window.visualViewport && visualViewport.height];
    function pick(a) { a = a.filter(function (v) { return v > 100; }); return a.length ? Math.min.apply(null, a) : 0; }
    return { w: pick(W), h: pick(H) };
  }
  function fit() {
    var v = viewSize();
    if (!v.w || !v.h) return setTimeout(fit, 200);
    var k = Math.min(v.w / 1920, v.h / 1080);
    if (q.get('debug') === '1') $('hint').textContent = 'inner ' + innerWidth + '×' + innerHeight + ' client ' + document.documentElement.clientWidth + ' screen ' + screen.width + '×' + screen.height + ' dpr ' + devicePixelRatio + ' k ' + k.toFixed(3);
    var st = $('stage');
    st.style.transform = 'scale(' + k + ')';
    st.style.left = ((v.w - 1920 * k) / 2) + 'px';
    st.style.top = ((v.h - 1080 * k) / 2) + 'px';
  }
  function drift() { $('stage').style.translate = Math.round(Math.random() * 24 - 12) + 'px ' + Math.round(Math.random() * 16 - 8) + 'px'; }

  function demoData() {
    var d = demoBase();
    if (q.get('people')) { var k = +q.get('people'); var src = d.users.slice(); for (var i = 2; i < k; i++) { var u = JSON.parse(JSON.stringify(src[i % 2])); u.name = ['Mom', 'Dad', 'Sam', 'Ava'][i - 2]; d.users.push(u); } }
    return d;
  }
  function demoBase() {
    var t = now().key;
    function ch(task, ico, done, st) { return { id: task, task: task, icon: ico, completed: !!done, status: st || 'available' }; }
    return {
      settings: { theme: 'DEFAULT', bulletin: 'Pizza night Friday! Pick your toppings by Thursday 🍕' },
      weather: { temperature: 54, unit: '°', icon: '⛅' },
      users: [
        { name: 'Madi', wallet: 120, streak: 6, today: { displayRoom: 'Kitchen', progress: { done: 2, total: 5, percent: 40 },
          chores: [ch('Make your bed', '🛏️', 1), ch('Feed the dog', '🐶', 1), ch('Unload dishwasher', '🍽️'), ch('Wipe counters', '🧽'), ch('Homework check-in', '📚', 0, 'upcoming')], weekly: [], quests: [], bonus: [] } },
        { name: 'Noah', wallet: 95, streak: 3, today: { displayRoom: 'Living room', dayComplete: true, progress: { done: 4, total: 4, percent: 100 },
          chores: [ch('Make your bed', '🛏️', 1), ch('Take out trash', '🗑️', 1), ch('Tidy toys', '🧸', 1), ch('Vacuum rug', '🧹', 1)], weekly: [], quests: [], bonus: [] } }
      ],
      events: [ { startStr: t, endStr: t, timeLabel: '3:30 PM', title: 'Soccer practice', color: '#5EC8FF' }, { startStr: t, endStr: t, timeLabel: '6:00 PM', title: 'Family dinner', color: '#FFD166' } ],
      countdowns: [ { name: 'Thanksgiving', dateStr: '2026-11-26', daysUntil: 31 }, { name: 'Noah\'s birthday', dateStr: '2026-12-02', daysUntil: 37 } ],
      meals: { today: { meals: { Dinner: 'Tacos 🌮' } } },
      pendingRewards: [ { member: 'Madi', reward: '30 Minutes Screen Time', when: '4:12 PM' }, { member: 'Noah', reward: 'Candy', when: 'Thu, Oct 29' } ]
    };
  }

  addEventListener('resize', fit);
  fit();
  setTimeout(fit, 500); setTimeout(fit, 2000);
  var snap = load(SNAP_KEY);
  if (snap && snap.data && !DEMO) { S.data = snap.data; S.at = snap.at; }
  clockTick();
  render();
  refresh();
  setInterval(clockTick, 15000);
  setInterval(refresh, REFRESH_MS);
  if (SAVER) setInterval(drift, 120000);
})();
</script>
</body>
