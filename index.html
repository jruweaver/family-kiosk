<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <script>
  /* Self-hosted mode: when this page is NOT served by Apps Script, google.script.run
     is replaced by calls to the web app (doPost) using the pairing key saved on
     this device. Inside Apps Script this block does nothing. */
  (function () {
    if (window.google && window.google.script && window.google.script.run) return;
    var CFG_KEY = 'fcc.api.v1';
    window.FCC_SELF_HOSTED = true;
    function readCfg() { try { return JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); } catch (e) { return null; } }
    function saveCfg(c) { try { localStorage.setItem(CFG_KEY, JSON.stringify(c)); } catch (e) { /* private mode */ } }
    // A pairing link (?api=…&key=…) is saved once and removed from the address bar.
    try {
      var q = new URLSearchParams(location.search);
      if (q.get('api') && q.get('key')) {
        saveCfg({ url: q.get('api').trim(), key: q.get('key').trim() });
        q.delete('api'); q.delete('key');
        var rest = q.toString();
        history.replaceState(null, '', location.pathname + (rest ? '?' + rest : '') + location.hash);
      }
    } catch (e) { /* old browser */ }

    function post(fn, args) {
      var cfg = readCfg();
      if (!cfg || !cfg.url || !cfg.key) { showSetup(); return Promise.reject(new Error('This device is not paired yet.')); }
      var ctl = window.AbortController ? new AbortController() : null;
      var timer = ctl ? setTimeout(function () { ctl.abort(); }, 90000) : null;
      return fetch(cfg.url, {
        method: 'POST', redirect: 'follow', credentials: 'omit',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // "simple" request: no CORS preflight
        body: JSON.stringify({ fn: fn, args: args, key: cfg.key }),
        signal: ctl ? ctl.signal : undefined
      }).then(function (res) {
        if (timer) clearTimeout(timer);
        if (!res.ok) throw new Error('NetworkError: HTTP ' + res.status);
        return res.text();
      }).then(function (text) {
        var out;
        try { out = JSON.parse(text); } catch (e) {
          // A Google sign-in page instead of JSON = the web app isn't shared with "Anyone".
          throw new Error('The web app answered with a web page instead of data. Check Deploy ▸ Manage deployments: Execute as "Me", Who has access "Anyone".');
        }
        if (out && (out.code === 'BAD_KEY' || out.code === 'NO_KEY')) showSetup(out.error);
        else markConnected();
        return out;
      }, function (err) {
        if (timer) clearTimeout(timer);
        var why = (err && err.message) || 'Connection failure';
        // Never connected on this device and the browser can't reach it at all: almost always
        // the deployment settings or the link, not the internet. Show the fix instead of looping.
        if (!wasConnected() && navigator.onLine !== false) {
          showSetup('Could not reach the web app (' + why + '). Check: 1) the link ends in /exec (not /dev); ' +
            '2) Deploy ▸ Manage deployments ▸ Execute as "Me", Who has access "Anyone"; 3) you chose Version: New version and clicked Deploy.');
        }
        throw new Error('NetworkError: ' + why);
      });
    }
    function wasConnected() { try { return localStorage.getItem('fcc.api.ok') === '1'; } catch (e) { return false; } }
    function markConnected() { try { localStorage.setItem('fcc.api.ok', '1'); } catch (e) { /* ignore */ } }

    function runner() {
      var h = {};
      return new Proxy({}, { get: function (_, name) {
        if (name === 'withSuccessHandler') return function (f) { h.s = f; return this; };
        if (name === 'withFailureHandler') return function (f) { h.f = f; return this; };
        if (name === 'withUserObject') return function () { return this; };
        return function () {
          var args = Array.prototype.slice.call(arguments);
          post(String(name), args).then(function (r) { if (h.s) h.s(r); }, function (e) { if (h.f) h.f(e); });
        };
      } });
    }
    window.google = window.google || {};
    window.google.script = {};
    Object.defineProperty(window.google.script, 'run', { get: runner });

    /* ---------- pairing screen ---------- */
    var setupShown = false;
    function showSetup(msg) {
      if (setupShown) return;
      setupShown = true;
      var go = function () {
        var cfg = readCfg() || {};
        var box = document.createElement('div');
        box.id = 'fccSetup';
        box.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#111317;color:#ECEEF2;display:flex;align-items:center;justify-content:center;padding:20px;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
        box.innerHTML = '<div style="width:100%;max-width:520px">' +
          '<h1 style="margin:0 0 6px;font-size:26px">Connect this device</h1>' +
          '<p style="margin:0 0 16px;color:#9AA2B1">Paste the web app link and pairing key from the script editor (run <b>setupSelfHosting</b>), or open the pairing link it printed.</p>' +
          (msg ? '<p style="margin:0 0 14px;color:#F06A72;font-weight:700;line-height:1.35"></p>' : '') +
          '<label style="display:block;color:#9AA2B1;font-size:14px;margin:8px 0 4px">Web app link (ends in /exec)</label>' +
          '<input id="fccUrl" style="width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #2B3039;background:#1B1E24;color:inherit;font:inherit" placeholder="https://script.google.com/macros/s/…/exec">' +
          '<label style="display:block;color:#9AA2B1;font-size:14px;margin:12px 0 4px">Pairing key</label>' +
          '<input id="fccKey" style="width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #2B3039;background:#1B1E24;color:inherit;font:inherit" autocomplete="off">' +
          '<button id="fccSave" style="margin-top:16px;width:100%;padding:14px;border:0;border-radius:10px;background:#5B8DF5;color:#0B1220;font:700 17px system-ui,sans-serif">Connect</button>' +
          '<p id="fccMsg" style="min-height:22px;margin:10px 0 0;color:#9AA2B1"></p></div>';
        document.body.appendChild(box);
        if (msg) box.querySelector('p[style*="F06A72"]').textContent = msg;
        document.getElementById('fccUrl').value = cfg.url || '';
        document.getElementById('fccKey').value = cfg.key || '';
        document.getElementById('fccSave').onclick = function () {
          var url = document.getElementById('fccUrl').value.trim(), key = document.getElementById('fccKey').value.trim();
          var m = document.getElementById('fccMsg');
          if (/\/dev(\?|$)/.test(url)) { m.textContent = 'That is the test link (/dev). Use the Web app URL ending in /exec from Deploy ▸ Manage deployments.'; return; }
          if (!/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec/.test(url)) { m.textContent = 'That doesn\'t look like a web app link ending in /exec.'; return; }
          if (!key) { m.textContent = 'Enter the pairing key.'; return; }
          m.textContent = 'Checking…';
          saveCfg({ url: url, key: key });
          post('ping', []).then(function (r) {
            if (r && r.ok && r.pong) { m.textContent = 'Connected!'; setTimeout(function () { location.reload(); }, 400); }
            else m.textContent = (r && r.error) || 'That didn\'t work.';
          }, function (e) { m.textContent = e.message.replace(/^NetworkError: /, 'Could not reach it: '); });
        };
      };
      if (document.body) go(); else document.addEventListener('DOMContentLoaded', go);
    }
    var saved = readCfg();
    if (!saved) showSetup();
    else if (/\/dev(\?|$)/.test(saved.url || '')) showSetup('This device was paired with the test link (/dev), which only works for you in the script editor. Paste the Web app URL ending in /exec.');

    /* ---------- app-like extras only possible outside Google's frame ---------- */
    document.addEventListener('DOMContentLoaded', function () {
      var mf = document.createElement('link');
      mf.rel = 'manifest';
      mf.href = /parents/i.test(location.pathname) ? 'parents.webmanifest' : 'manifest.webmanifest';
      document.head.appendChild(mf);
    });
    // Keep the kiosk screen on (not on the phone page).
    if (!/parents/i.test(location.pathname) && navigator.wakeLock) {
      var wake = null;
      var lock = function () {
        if (document.visibilityState !== 'visible' || (wake && !wake.released)) return;
        navigator.wakeLock.request('screen').then(function (l) { wake = l; }, function () { /* not allowed right now */ });
      };
      document.addEventListener('visibilitychange', lock);
      window.addEventListener('load', lock);
      document.addEventListener('pointerdown', lock, { passive: true });
    }
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* offline start not available */ }); });
    }
  })();
  </script>
  <title>Family Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
  <style>
    /* ======================================================================
       THEMES — every theme is a full palette, not an accent swap.
       Names match the App UI "app theme" values from the legacy kiosk.
       ====================================================================== */
    :root, [data-theme="DEFAULT"] {            /* Classic Mint */
      --bg: #0E2320; --bg-glow: #12352F;
      --surface: #16302C; --surface-2: #1E3D38; --surface-3: #285049;
      --line: #2F5A52; --text: #EAF7F2; --muted: #9DBDB4; --faint: #6E9188;
      --accent: #5EE6B5; --accent-ink: #062A1F;
      --coin: #F5C451; --flame: #FF8A4C; --vault: #B49CFF; --ok: #5EE6B5; --warn: #FFC864; --danger: #FF6B6B;
    }
    [data-theme="HALLOWEEN"] {
      --bg: #1A1020; --bg-glow: #2A1630;
      --surface: #24162B; --surface-2: #2F1D37; --surface-3: #3D2647;
      --line: #4A2F55; --text: #FBEFE3; --muted: #C7A9BD; --faint: #8E7088;
      --accent: #FF8A3D; --accent-ink: #2A1203;
      --coin: #FFC94D; --flame: #FF5E3A; --vault: #A98BFF; --ok: #9BE15D; --warn: #FFC94D; --danger: #FF5C7A;
    }
    [data-theme="DARK"] {                       /* Midnight Slate */
      --bg: #14171C; --bg-glow: #1C2129;
      --surface: #1B1F26; --surface-2: #232832; --surface-3: #2E3440;
      --line: #363D4A; --text: #E8ECF2; --muted: #A3ACBA; --faint: #6F7889;
      --accent: #7AA7FF; --accent-ink: #0A1730;
      --coin: #F2C14E; --flame: #FF8752; --vault: #B39DFF; --ok: #6BD69B; --warn: #F2C14E; --danger: #FF6B6B;
    }
    [data-theme="OCEAN"] {
      --bg: #0B2236; --bg-glow: #0F3049;
      --surface: #102C44; --surface-2: #163852; --surface-3: #1D4663;
      --line: #255474; --text: #E6F6FF; --muted: #9CC4DA; --faint: #6A93AA;
      --accent: #3DD6D0; --accent-ink: #032726;
      --coin: #FFD166; --flame: #FF8C69; --vault: #A5B4FC; --ok: #5EEAD4; --warn: #FFD166; --danger: #FF7A8A;
    }
    [data-theme="HOLIDAY"] {
      --bg: #10261C; --bg-glow: #163424;
      --surface: #163224; --surface-2: #1D3E2D; --surface-3: #264D39;
      --line: #2F5C44; --text: #FFF8EC; --muted: #C9D8C2; --faint: #8DA58F;
      --accent: #F2545B; --accent-ink: #2B0507;
      --coin: #F7C948; --flame: #FF8F4D; --vault: #C4B5FD; --ok: #7BD88F; --warn: #F7C948; --danger: #FF6B6B;
    }
    [data-theme="ARCADE"] {
      --bg: #120E2A; --bg-glow: #1D1442;
      --surface: #1A1438; --surface-2: #231B4A; --surface-3: #2E245E;
      --line: #3B2F75; --text: #F3F0FF; --muted: #B5ACE0; --faint: #7D73AE;
      --accent: #FF4FD8; --accent-ink: #2B0526;
      --coin: #FFE14D; --flame: #FF7A3D; --vault: #3CF0FF; --ok: #5CFF9D; --warn: #FFE14D; --danger: #FF5C7A;
    }

    /* ======================================================================
       BASE
       ====================================================================== */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Atkinson Hyperlegible', system-ui, sans-serif;
      font-size: 18px;
      line-height: 1.4;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    input, textarea, select { user-select: text; -webkit-user-select: text; }
    #bgPhoto {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(1200px 700px at 15% 0%, var(--bg-glow), transparent 70%) , var(--bg);
      background-size: cover; background-position: center;
    }
    #bgPhoto.has-photo::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 70%, transparent), color-mix(in srgb, var(--bg) 92%, transparent));
    }
    .display { font-family: 'Bricolage Grotesque', 'Atkinson Hyperlegible', system-ui, sans-serif; font-optical-sizing: auto; }
    h1, h2, h3 { font-family: 'Bricolage Grotesque', 'Atkinson Hyperlegible', system-ui, sans-serif; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
    h2 { font-size: 30px; }
    h3 { font-size: 22px; }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
      outline: 3px solid var(--accent); outline-offset: 2px;
    }
    img { display: block; }
    .hidden { display: none !important; }
    .muted { color: var(--muted); }
    .faint { color: var(--faint); }
    .coin { color: var(--coin); }
    .num { font-variant-numeric: tabular-nums; }

    #app { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; }
    .view { position: absolute; inset: 0; display: none; flex-direction: column; }
    .view.active { display: flex; animation: viewIn .16s ease-out; }
    @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

    /* sync indicator: a thin line, never a blocking spinner */
    #syncBar { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 50; pointer-events: none; overflow: hidden; opacity: 0; transition: opacity .2s; }
    #syncBar.on { opacity: 1; }
    #syncBar::before { content: ''; position: absolute; top: 0; bottom: 0; width: 35%; background: var(--accent); animation: sync 1.1s ease-in-out infinite; border-radius: 3px; }
    @keyframes sync { from { left: -35%; } to { left: 100%; } }

    /* ======================================================================
       SHARED CONTROLS
       ====================================================================== */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      min-height: 56px; padding: 0 24px; border-radius: 16px;
      background: var(--surface-3); color: var(--text); font-weight: 700; font-size: 19px;
      transition: transform .08s, background .15s;
    }
    .btn:active { transform: scale(.97); }
    .btn.primary { background: var(--accent); color: var(--accent-ink); }
    .btn.danger { background: color-mix(in srgb, var(--danger) 22%, var(--surface-2)); color: var(--danger); }
    .btn.ghost { background: transparent; border: 2px solid var(--line); }
    .btn.small { min-height: 44px; padding: 0 16px; font-size: 16px; border-radius: 12px; }
    .btn[disabled] { opacity: .45; pointer-events: none; }
    .icon-btn {
      width: 56px; height: 56px; border-radius: 16px; display: inline-grid; place-items: center;
      background: var(--surface-2); font-size: 24px; flex: none;
    }
    .icon-btn:active { transform: scale(.94); }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
      background: var(--surface-2); color: var(--muted); font-size: 15px; font-weight: 700; white-space: nowrap;
    }
    .field { display: block; width: 100%; min-height: 56px; padding: 12px 16px; border-radius: 14px;
      border: 2px solid var(--line); background: var(--surface); color: var(--text); font: inherit; font-size: 19px; }
    textarea.field { min-height: 110px; resize: none; }
    .label { display: block; font-size: 15px; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
    .seg { display: inline-flex; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; flex-wrap: wrap; }
    .seg button { min-height: 46px; padding: 0 16px; border-radius: 10px; font-weight: 700; color: var(--muted); }
    .seg button.on { background: var(--accent); color: var(--accent-ink); }
    .media { width: 64px; height: 64px; border-radius: 14px; flex: none; display: grid; place-items: center; font-size: 36px; background: var(--surface-3); overflow: hidden; }
    .media img { width: 100%; height: 100%; object-fit: cover; }
    .avatar { width: 64px; height: 64px; border-radius: 50%; flex: none; display: grid; place-items: center;
      background: var(--kid, var(--surface-3)); color: var(--bg); font-family: 'Bricolage Grotesque', 'Atkinson Hyperlegible', system-ui, sans-serif; font-weight: 800; font-size: 28px; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .empty { padding: 28px; text-align: center; color: var(--muted); }

    /* ======================================================================
       HOME — clock rail + family calendar
       ====================================================================== */
    #home { flex-direction: row; }
    .rail { width: 400px; flex: none; display: flex; flex-direction: column; padding: 22px 22px 18px 30px; gap: 12px; }
    .clock { font-family: 'Bricolage Grotesque', 'Atkinson Hyperlegible', system-ui, sans-serif; font-weight: 800; font-stretch: 75%; font-size: 104px; line-height: .86; letter-spacing: -0.04em; white-space: nowrap; }
    .clock small { font-size: 32px; font-weight: 600; letter-spacing: 0; margin-left: 6px; color: var(--muted); font-stretch: 85%; }
    .today-line { display: flex; align-items: center; gap: 14px; font-size: 21px; color: var(--muted); flex-wrap: wrap; }
    .weather-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--text); font-weight: 700; font-size: 21px; }
    .weather-btn img { width: 40px; height: 40px; margin: -6px -4px; }
    /* Message board: big, warm, and glowing while the message is new */
    .bulletin { position: relative; padding: 12px 16px 14px; border-radius: 18px; background: color-mix(in srgb, var(--warn) 26%, var(--surface));
      border: 2px solid color-mix(in srgb, var(--warn) 70%, transparent); box-shadow: 0 6px 22px color-mix(in srgb, var(--warn) 22%, transparent); }
    .bulletin .bl-label { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--warn); }
    .bulletin .bl-new { padding: 1px 8px; border-radius: 999px; background: var(--warn); color: #1b1300; font-size: 12px; letter-spacing: .04em; }
    .bulletin .bl-text { margin-top: 4px; font-family: 'Bricolage Grotesque', 'Atkinson Hyperlegible', system-ui, sans-serif; font-size: 25px; font-weight: 800; line-height: 1.2; }
    .bulletin.is-new { animation: blGlow 2.4s ease-in-out infinite; }
    @keyframes blGlow { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--warn) 55%, transparent); } 50% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--warn) 0%, transparent), 0 6px 26px color-mix(in srgb, var(--warn) 35%, transparent); } }
    .kid-bulletin { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; padding: 16px 20px; border-radius: 20px;
      background: color-mix(in srgb, var(--warn) 24%, var(--surface)); border: 2px solid color-mix(in srgb, var(--warn) 70%, transparent); }
    .kid-bulletin .big { font-size: 40px; }
    .kid-bulletin .tx { flex: 1; font-size: 24px; font-weight: 800; line-height: 1.25; }
    .kid-bulletin .tx small { display: block; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--warn); }
    #saverNote { margin-top: 14px; font-size: 24px; font-weight: 800; color: var(--warn); max-width: 560px; }
    .players { display: flex; flex-direction: column; gap: 8px; }
    .player {
      display: flex; align-items: center; gap: 14px; padding: 10px 14px; border-radius: 20px; text-align: left;
      background: var(--surface); border: 2px solid transparent; transition: border-color .15s, transform .08s;
    }
    .player:active { transform: scale(.98); border-color: var(--kid); }
    .player .info { flex: 1; min-width: 0; }
    .player .name { font-family: 'Bricolage Grotesque', 'Atkinson Hyperlegible', system-ui, sans-serif; font-size: 24px; font-weight: 800; line-height: 1.1; }
    .player .room { font-size: 15px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player .stats { display: flex; gap: 12px; font-size: 16px; font-weight: 700; margin-top: 2px; }
    .progress { height: 7px; border-radius: 7px; background: var(--surface-3); overflow: hidden; margin-top: 6px; }
    .progress > i { display: block; height: 100%; background: var(--kid, var(--accent)); border-radius: 8px; transition: width .4s; }
    .done-badge { color: var(--ok); }
    /* Shortcut buttons, in the calendar header next to the month */
    .head-tiles { flex: 1 1 auto; min-width: 0; display: flex; justify-content: center; gap: 10px; }
    .tile { flex: 0 1 104px; min-width: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 80px; padding: 6px 4px;
      border-radius: 20px; background: var(--surface); font-weight: 800; font-size: 17px; color: var(--text); }
    .tile span:first-child { font-size: 32px; line-height: 1.05; }
    .tile:active { transform: scale(.96); }
    /* Countdown card: the next event big, up to two more underneath */
    .countdowns { flex: none; display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 20px;
      background: color-mix(in srgb, var(--coin) 16%, var(--surface)); border: 2px solid color-mix(in srgb, var(--coin) 55%, transparent); }
    .countdowns:empty { display: none; }
    .cd-main { display: flex; align-items: center; gap: 16px; }
    .cd-num { flex: none; min-width: 84px; text-align: center; font-family: 'Bricolage Grotesque', 'Atkinson Hyperlegible', system-ui, sans-serif;
      font-weight: 800; font-size: 60px; line-height: .9; color: var(--coin); letter-spacing: -0.03em; }
    .cd-num small { display: block; font-size: 15px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
    .cd-num.today { font-size: 34px; line-height: 1.1; }
    .cd-label { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--coin); }
    .cd-name { font-family: 'Bricolage Grotesque', 'Atkinson Hyperlegible', system-ui, sans-serif; font-size: 26px; font-weight: 800; line-height: 1.1;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .cd-date { font-size: 16px; color: var(--muted); font-weight: 600; margin-top: 2px; }
    .cd-next { display: flex; align-items: baseline; gap: 10px; padding-top: 8px; border-top: 1px solid color-mix(in srgb, var(--coin) 30%, transparent); font-size: 17px; font-weight: 700; }
    .cd-next b { flex: none; min-width: 64px; color: var(--coin); }
    .cd-next span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .board { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 24px 28px 20px 8px; gap: 14px; }
    .board-head { display: flex; align-items: center; gap: 12px; }
    .board-head h2 { flex: none; font-size: 34px; white-space: nowrap; }
    .meal-pill { flex: 0 1 auto; min-width: 0; padding: 10px 16px; border-radius: 14px; background: var(--surface); font-weight: 700; font-size: 17px; max-width: 360px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cal { flex: 1; min-height: 0; display: grid; grid-template-rows: auto 1fr; background: var(--surface); border-radius: 24px; padding: 10px; }
    .cal-wd { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 15px; font-weight: 700; color: var(--faint); padding: 4px 0 8px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; gap: 6px; min-height: 0; }
    .day { position: relative; border-radius: 14px; background: var(--surface-2); padding: 6px 8px; text-align: left; display: flex; flex-direction: column; gap: 3px; overflow: hidden; min-height: 0; }
    .day.out { opacity: .38; }
    .day.today { box-shadow: inset 0 0 0 3px var(--accent); }
    .day .d { font-weight: 700; font-size: 17px; color: var(--muted); }
    .day.today .d { color: var(--accent); }
    .ev { font-size: 13px; line-height: 1.25; padding: 2px 6px; border-radius: 6px; background: color-mix(in srgb, var(--evc, var(--accent)) 26%, transparent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ev.cd { background: color-mix(in srgb, var(--coin) 24%, transparent); }
    .more { font-size: 12px; color: var(--muted); font-weight: 700; }
    .cal-err { padding: 8px 14px; color: var(--warn); font-size: 15px; }

    /* ======================================================================
       TOP BAR (inner screens)
       ====================================================================== */
    .topbar { display: flex; align-items: center; gap: 14px; padding: 18px 24px; flex: none; }
    .topbar h2 { flex: 1; font-size: 30px; min-width: 0; }
    .tabs { display: flex; gap: 8px; padding: 0 24px 12px; flex: none; overflow-x: auto; }
    .tab { min-height: 52px; padding: 0 20px; border-radius: 14px; font-weight: 700; color: var(--muted); background: var(--surface); white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
    .tab.on { background: var(--text); color: var(--bg); }
    .tab .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger); }
    .pane { flex: 1; min-height: 0; padding: 4px 24px 120px; }

    /* ======================================================================
       KID BOARD
       ====================================================================== */
    .kid-head { display: flex; align-items: center; gap: 16px; padding: 16px 24px 12px; flex: none; }
    .kid-head .who { flex: 1; min-width: 0; }
    .kid-head .who h2 { font-size: 34px; line-height: 1; }
    .kid-head .who .room { color: var(--muted); font-size: 17px; margin-top: 4px; }
    .stat { display: flex; flex-direction: column; align-items: flex-end; padding: 8px 16px; border-radius: 16px; background: var(--surface); min-width: 120px; }
    .stat b { font-family: 'Bricolage Grotesque', 'Atkinson Hyperlegible', system-ui, sans-serif; font-size: 34px; line-height: 1; font-weight: 800; }
    .stat span { font-size: 14px; color: var(--muted); font-weight: 700; }
    .stat.bump b { animation: bump .5s; }
    @keyframes bump { 30% { transform: scale(1.25); } }
    .streak-dots { display: flex; gap: 4px; margin-top: 6px; }
    .streak-dots i { width: 14px; height: 6px; border-radius: 3px; background: var(--surface-3); }
    .streak-dots i.on { background: var(--flame); }

    .kid-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
    .section { margin-bottom: 22px; }
    .section-head { display: flex; align-items: baseline; gap: 12px; margin: 4px 0 12px; }
    .section-head h3 { flex: 1; }
    .chores { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
    .chore {
      position: relative; display: grid; grid-template-columns: 60px minmax(0, 1fr) 36px; gap: 14px; align-items: center; text-align: left;
      padding: 14px; border-radius: 20px; background: var(--surface); border: 2px solid transparent;
      transition: background .2s, border-color .2s, opacity .2s, transform .08s;
    }
    .chore:active { transform: scale(.98); }
    .chore .body { flex: 1; min-width: 0; }
    .chore .t { font-weight: 700; font-size: 19px; line-height: 1.2; }
    .chore .s { font-size: 15px; color: var(--muted); margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .chore .media { width: 60px; height: 60px; }
    .chore .meta { display: flex; align-items: center; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
    .chore .pts { font-family: 'Bricolage Grotesque', 'Atkinson Hyperlegible', system-ui, sans-serif; font-weight: 800; font-size: 20px; color: var(--coin); }
    .chore .pts.tix { color: var(--vault); }
    .chore .tag { position: absolute; top: -9px; left: 14px; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--surface-3); color: var(--text); }
    .chore .tag.quest { background: var(--danger); color: #fff; }
    .chore .tag.weekly { background: var(--vault); color: var(--bg); }
    .chore .check { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); flex: none; display: grid; place-items: center; font-size: 18px; font-weight: 800; }
    .chore.done { background: color-mix(in srgb, var(--ok) 14%, var(--surface)); }
    .chore.done .check { background: var(--ok); border-color: var(--ok); color: var(--bg); }
    .chore.done .t { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--ok) 70%, transparent); }
    .chore.pending .check { border-color: var(--ok); border-top-color: transparent; animation: spin .9s linear infinite; background: none; color: transparent; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .chore.locked { opacity: .5; }
    .chore.missed { opacity: .55; border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
    .chore .when { font-size: 14px; font-weight: 700; color: var(--warn); }
    .chore.missed .when { color: var(--danger); }
    .claim-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .claim-btn { padding: 22px; border-radius: 20px; background: var(--surface); text-align: left; border: 2px dashed var(--line); }
    .claim-btn b { display: block; font-family: 'Bricolage Grotesque', 'Atkinson Hyperlegible', system-ui, sans-serif; font-size: 24px; }
    .claim-btn[disabled] { opacity: .45; }
    .side-card { background: var(--surface); border-radius: 22px; padding: 16px; margin-bottom: 16px; }
    .side-card h3 { margin-bottom: 4px; }
    .side-card > p { margin: 0 0 12px; color: var(--muted); font-size: 15px; }
    .mini { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
    .mini:first-of-type { border-top: 0; }
    .mini .media { width: 48px; height: 48px; font-size: 26px; border-radius: 12px; }
    .mini .body { flex: 1; min-width: 0; }
    .mini .t { font-weight: 700; }
    .mini .s { font-size: 14px; color: var(--muted); }
    .day-done { display: flex; align-items: center; gap: 16px; padding: 18px; border-radius: 20px; background: color-mix(in srgb, var(--ok) 16%, var(--surface)); margin-bottom: 18px; font-size: 19px; font-weight: 700; }
    .day-done .big { font-size: 40px; }

    .rewards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
    .reward { display: flex; flex-direction: column; border-radius: 22px; background: var(--surface); overflow: hidden; text-align: left; position: relative; }
    .reward .pic { aspect-ratio: 4 / 3; display: grid; place-items: center; font-size: 64px; background: var(--surface-2); }
    .reward .pic img { width: 100%; height: 100%; object-fit: contain; padding: 14px; }
    .reward .rb { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .reward .n { font-weight: 700; font-size: 18px; line-height: 1.2; }
    .reward .c { margin-top: auto; padding-top: 6px; font-family: 'Bricolage Grotesque', 'Atkinson Hyperlegible', system-ui, sans-serif; font-weight: 800; font-size: 22px; color: var(--coin); }
    .reward .c s { color: var(--faint); font-size: 16px; margin-right: 6px; }
    .reward .c .tix { color: var(--vault); font-size: 18px; margin-left: 8px; }
    .reward.cant { opacity: .5; }
    .reward .badge { position: absolute; top: 10px; left: 10px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 800; background: var(--danger); color: #fff; }
    .reward .badge.keep { background: var(--vault); color: var(--bg); }
    .lockbar { display: flex; gap: 14px; align-items: center; padding: 16px 18px; border-radius: 18px; background: color-mix(in srgb, var(--warn) 14%, var(--surface)); margin-bottom: 16px; font-weight: 700; }
    .vault-door { max-width: 640px; margin: 20px auto; text-align: center; padding: 36px 28px; border-radius: 28px; background: var(--surface); }
    .vault-door .lock { font-size: 72px; }
    .vault-door h2 { margin: 8px 0 6px; }
    .req { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; text-align: left; }
    .req div { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; background: var(--surface-2); font-weight: 700; }
    .req div.met { color: var(--ok); }
    .req div span:first-child { width: 28px; text-align: center; }
    .vault-head { display: flex; align-items: center; gap: 16px; padding: 16px 18px; border-radius: 20px; background: color-mix(in srgb, var(--vault) 16%, var(--surface)); margin-bottom: 16px; }
    .vault-head .tix { font-family: 'Bricolage Grotesque', 'Atkinson Hyperlegible', system-ui, sans-serif; font-size: 34px; font-weight: 800; color: var(--vault); }

    .month { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .mday { min-height: 96px; border-radius: 14px; background: var(--surface); padding: 8px; text-align: left; display: flex; flex-direction: column; gap: 4px; }
    .mday.blank { background: transparent; }
    .mday.today { box-shadow: inset 0 0 0 3px var(--accent); }
    .mday .d { font-weight: 700; color: var(--muted); }
    .mday .r { font-size: 12px; color: var(--muted); line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .mday .bar { margin-top: auto; display: flex; gap: 2px; flex-wrap: wrap; }
    .mday .bar i { width: 10px; height: 10px; border-radius: 3px; background: var(--surface-3); }
    .mday .bar i.c { background: var(--ok); }
    .mday .bar i.x { background: var(--danger); }
    .mday.waived .d::after { content: ' ✋'; }
    .month-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .month-nav h3 { flex: 1; text-align: center; font-size: 26px; }

    .list-rows .row { display: flex; align-items: center; gap: 14px; padding: 14px 4px; border-top: 1px solid var(--line); }
    .list-rows .row:first-child { border-top: 0; }
    .row .grow { flex: 1; min-width: 0; }

    /* ======================================================================
       LISTS & MEALS
       ====================================================================== */
    .list-cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; align-items: start; }
    .list-card { background: var(--surface); border-radius: 22px; padding: 14px; }
    .list-card h3 { display: flex; align-items: center; gap: 10px; margin: 2px 4px 10px; }
    .list-card h3 .chip { margin-left: auto; }
    .item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 14px; }
    .item + .item { margin-top: 4px; }
    .item .box { width: 36px; height: 36px; border-radius: 10px; border: 3px solid var(--line); flex: none; display: grid; place-items: center; font-weight: 800; }
    .item.need .box { border-color: var(--warn); }
    .item.sel .box { background: var(--ok); border-color: var(--ok); color: var(--bg); }
    .item.have { color: var(--muted); }
    .item.have .box { border-style: dashed; }
    .item .name { flex: 1; font-weight: 700; font-size: 19px; }
    .item.have .name { font-weight: 400; }
    .item .x { width: 40px; height: 40px; border-radius: 10px; color: var(--faint); font-size: 22px; }
    .add-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; background: var(--surface); border-radius: 22px; padding: 14px; margin-bottom: 16px; }
    .add-bar .field { flex: 1 1 260px; }
    .meal-table { width: 100%; border-collapse: separate; border-spacing: 6px; }
    .meal-table th { font-size: 16px; color: var(--muted); text-align: left; padding: 6px 10px; }
    .meal-table td { background: var(--surface); border-radius: 14px; padding: 14px; font-size: 18px; vertical-align: top; }
    .meal-table td.today { background: color-mix(in srgb, var(--accent) 18%, var(--surface)); }
    .meal-table th.today { color: var(--accent); }

    /* ======================================================================
       SHEETS, MODALS, PICKERS
       ====================================================================== */
    .scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .55); display: none; align-items: center; justify-content: center; padding: 24px; }
    .scrim.open { display: flex; animation: fade .14s ease-out; }
    @keyframes fade { from { opacity: 0; } }
    .sheet { width: min(720px, 100%); max-height: calc(100vh - 48px); overflow-y: auto; background: var(--surface); border-radius: 28px; padding: 26px; box-shadow: 0 30px 80px rgba(0, 0, 0, .5); animation: rise .18s ease-out; }
    .sheet.narrow { width: min(460px, 100%); }
    @keyframes rise { from { transform: translateY(14px); opacity: .6; } }
    .sheet-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .sheet-head h2 { flex: 1; font-size: 28px; }
    .sheet-actions { display: flex; gap: 12px; margin-top: 22px; }
    .sheet-actions .btn { flex: 1; }
    .stack > * + * { margin-top: 16px; }

    .pinpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
    .pinpad button { height: 76px; border-radius: 18px; background: var(--surface-2); font-family: 'Bricolage Grotesque', 'Atkinson Hyperlegible', system-ui, sans-serif; font-size: 32px; font-weight: 700; }
    .pinpad button:active { background: var(--surface-3); transform: scale(.96); }
    .pinpad .alt { font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; font-size: 18px; color: var(--muted); }
    .pin-dots { display: flex; justify-content: center; gap: 18px; margin: 14px 0 4px; height: 28px; }
    .pin-dots i { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--line); }
    .pin-dots i.on { background: var(--text); border-color: var(--text); }
    .pin-dots.shake { animation: shake .35s; }
    @keyframes shake { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
    .pin-who { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
    .pin-who .avatar { width: 88px; height: 88px; font-size: 38px; }
    .pin-msg { text-align: center; min-height: 24px; color: var(--muted); font-weight: 700; }
    .pin-msg.err { color: var(--danger); }

    .picker { background: var(--surface-2); border-radius: 18px; padding: 14px; }
    .picker-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .picker-head b { flex: 1; text-align: center; font-size: 19px; }
    .dp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .dp-grid .wd { font-size: 13px; color: var(--faint); font-weight: 700; padding: 4px 0; }
    .dp-grid button { height: 46px; border-radius: 12px; font-weight: 700; }
    .dp-grid button.today { box-shadow: inset 0 0 0 2px var(--accent); }
    .dp-grid button.on { background: var(--accent); color: var(--accent-ink); }
    .tp { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: start; }
    .tp-hours { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .tp-mins { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 10px; }
    .tp button { height: 48px; border-radius: 12px; background: var(--surface); font-weight: 700; font-size: 18px; }
    .tp button.on { background: var(--accent); color: var(--accent-ink); }
    .tp-ampm { display: flex; flex-direction: column; gap: 6px; }
    .tp-ampm button { width: 84px; }
    .tp-readout { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    .tp-readout b { flex: 1; font-family: 'Bricolage Grotesque', 'Atkinson Hyperlegible', system-ui, sans-serif; font-size: 30px; }
    .value-btn { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 56px; padding: 0 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; font-size: 19px; }
    .value-btn span:last-child { color: var(--muted); font-weight: 400; }

    .event-row { display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 16px; background: var(--surface-2); }
    .event-row + .event-row { margin-top: 8px; }
    .event-row .bar { width: 6px; align-self: stretch; border-radius: 3px; background: var(--evc, var(--accent)); }
    .event-row .grow { flex: 1; min-width: 0; }
    .event-row .t { font-weight: 700; font-size: 19px; }
    .event-row .s { color: var(--muted); font-size: 15px; }
    .forecast { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; text-align: center; }
    .forecast div { background: var(--surface-2); border-radius: 16px; padding: 12px 6px; }
    .forecast .ic { font-size: 36px; }

    #toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 200%); visibility: hidden; z-index: 60; padding: 14px 22px; border-radius: 16px; background: var(--text); color: var(--bg); font-weight: 700; font-size: 18px; max-width: 80vw; transition: transform .22s; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
    #toast.show { transform: translate(-50%, 0); visibility: visible; }
    #toast.err { background: var(--danger); color: #fff; }

    .celebrate { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; background: color-mix(in srgb, var(--bg) 70%, transparent); }
    .celebrate.open { display: flex; }
    .celebrate .card { text-align: center; padding: 34px 44px; border-radius: 32px; background: var(--surface); animation: pop .35s cubic-bezier(.2, 1.6, .4, 1); max-width: 520px; }
    .celebrate .big { font-size: 96px; line-height: 1; }
    .celebrate h2 { font-size: 40px; margin: 12px 0 6px; }
    @keyframes pop { from { transform: scale(.6); opacity: 0; } }
    .floaty { position: fixed; z-index: 45; pointer-events: none; font-family: 'Bricolage Grotesque', 'Atkinson Hyperlegible', system-ui, sans-serif; font-weight: 800; font-size: 28px; color: var(--coin); animation: floatUp .9s ease-out forwards; }
    @keyframes floatUp { to { transform: translateY(-70px); opacity: 0; } }

    /* sticky action bar (chore turn-in, list restock, admin save) */
    .dock { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 20; display: flex; align-items: center; gap: 14px; padding: 12px 12px 12px 22px; border-radius: 22px; background: var(--text); color: var(--bg); box-shadow: 0 16px 40px rgba(0, 0, 0, .45); width: min(760px, calc(100% - 40px)); font-weight: 700; font-size: 19px; }
    .dock .grow { flex: 1; }
    .dock .btn { background: var(--bg); color: var(--text); }
    .dock .btn.primary { background: var(--accent); color: var(--accent-ink); }

    /* ======================================================================
       ADMIN
       ====================================================================== */
    .admin-users { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; }
    .card { background: var(--surface); border-radius: 22px; padding: 18px; }
    .card + .card { margin-top: 16px; }
    .admin-users .card + .card, .grid2 .card + .card { margin-top: 0; }
    .card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .card-head .grow { flex: 1; min-width: 0; }
    .kv { display: flex; gap: 16px; flex-wrap: wrap; font-weight: 700; color: var(--muted); }
    .kv b { color: var(--text); }
    .table { width: 100%; border-collapse: collapse; }
    .table td, .table th { padding: 12px 8px; border-top: 1px solid var(--line); text-align: left; vertical-align: middle; }
    .table th { color: var(--muted); font-size: 15px; border-top: 0; }
    .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .queued { outline: 2px dashed var(--warn); outline-offset: 2px; }
    .admin-chore { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
    .admin-chore .grow { flex: 1; min-width: 0; }

    else { bg.style.backgroundImage = ''; bg.classList.remove('has-photo'); }
  }

  /* ==========================================================================
     CLOCK & IDLE TIMERS (1 Hz)
     ========================================================================== */
  function tick() {
    var t = nowParts();
    checkAlarms(t);
    var minuteKey = t.key + ' ' + t.time;
    if (minuteKey !== S.lastMinute) {
      S.lastMinute = minuteKey;
      $('clock').innerHTML = esc(t.time) + '<small>' + t.ampm + '</small>';
      $('dateLine').textContent = prettyDate(t.key);
      $('saverTime').innerHTML = esc(t.time) + '<small>' + t.ampm + '</small>';
      $('saverDate').textContent = prettyDate(t.key);
      if (t.min % 2 === 0) driftSaver();
      if (S.today && t.key !== S.today) { S.today = t.key; S.cal = { y: t.y, m: t.m }; refresh(); } // new day
    }
    if (S.view === 'kid' && S.kidTab === 'vault') {
      var el = $('vaultClock');
      if (el) el.textContent = untilMidnight();
    }
    var s = settings();
    var idle = (Date.now() - S.lastInput) / 1000;
    if (s.autoLogoutEnabled && (S.view === 'kid' || S.view === 'admin') && idle > (s.autoLogoutSeconds || 120) && !S.saverOpen) {
      if (S.view === 'admin' && dirtyCount() > 0) { /* never drop a parent's unsaved edits */ }
      else { goHome(); toast('Logged out after inactivity'); }
    }
    if (s.screensaverEnabled && s.screensaverSeconds > 0 && !S.saverOpen && idle > s.screensaverSeconds && !isTyping()) openSaver();
    if (s.autoRefreshEnabled && Date.now() - S.loadedAt > (s.autoRefreshMinutes || 60) * 60000 && S.view === 'home' && !S.saverOpen) refresh();
  }
  function isTyping() {
    var a = document.activeElement;
    return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA');
  }
  function untilMidnight() {
    var t = nowParts();
    var left = (24 * 60) - (t.h * 60 + t.min);
    return Math.floor(left / 60) + 'h ' + pad(left % 60) + 'm';
  }
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function (ev) {
    document.addEventListener(ev, function () { S.lastInput = Date.now(); }, { capture: true, passive: true });
  });

  /* ==========================================================================
     SCREENSAVER — black, dim, drifting; wakes on any touch
     ========================================================================== */
  function openSaver() {
    var s = settings();
    S.saverOpen = true;
    var sv = s.screensaverImage ? mediaUrl(s.screensaverImage) : '';
    $('saverPhoto').style.backgroundImage = sv && sv !== BLANK_IMG ? 'url("' + sv.replace(/"/g, '%22') + '")' : '';
    var lines = [];
    var w = S.data && S.data.weather;
    if (w && w.temperature !== null && w.temperature !== undefined) lines.push(w.icon + ' ' + w.temperature + w.unit + ' · ' + esc(w.condition));
    todayEvents().slice(0, 3).forEach(function (ev) { lines.push('📅 ' + esc(ev.allDay ? 'All day' : ev.timeLabel) + ' — ' + esc(ev.title)); });
    var meal = currentMeal();
    if (meal) lines.push('🍽️ ' + esc(meal.label) + ': ' + esc(meal.text));
    $('saverAgenda').innerHTML = lines.join('<br>');
    $('saverNote').textContent = s.bulletin ? '📌 ' + s.bulletin : '';
    $('saver').classList.add('open');
    driftSaver();
  }
  function closeSaver() {
    if (!S.saverOpen) return;
    S.saverOpen = false;
    $('saver').classList.remove('open');
    if (Date.now() - S.loadedAt > 180000) refresh();
  }
  function driftSaver() {
    if (!S.saverOpen) return;
    var box = $('saverBox');
    var maxX = Math.max(0, innerWidth - box.offsetWidth - 60);
    var maxY = Math.max(0, innerHeight - box.offsetHeight - 60);
    box.style.left = (30 + Math.random() * maxX) + 'px';
    box.style.top = (30 + Math.random() * maxY) + 'px';
  }
  /* Waking up must not also "tap" whatever is under the finger: the screensaver
     stays up until the whole tap is over (it receives the click itself), and any
     click/tap that still arrives in the next moment is swallowed. */
  var wakeGuardUntil = 0;
  function swallowTap(e) {
    if (S.saverOpen || Date.now() < wakeGuardUntil) {
      e.preventDefault();
      e.stopPropagation();
      if (e.stopImmediatePropagation) e.stopImmediatePropagation();
      return true;
    }
    return false;
  }
  $('saver').addEventListener('pointerdown', function (e) { e.preventDefault(); e.stopPropagation(); });
  $('saver').addEventListener('click', function (e) {
    e.preventDefault(); e.stopPropagation();

  // Capture phase: runs before any button/day handler on the page.
  ['click', 'pointerup', 'mouseup', 'touchend'].forEach(function (type) {
    document.addEventListener(type, function (e) {
      if (e.target && e.target.closest && e.target.closest('#saver')) return; // the saver's own tap
      swallowTap(e);
    }, true);
  });

  /** The meal to show right now (legacy rule: breakfast before 10, lunch until 2, then dinner). */
  function currentMeal() {
    var meals = S.data && S.data.meals;
    if (!meals || !meals.today) return null;
    var m = meals.today.meals || {};
    var h = nowParts().h;
    function get(k) { return (m[k] || '').trim(); }
    var order = h < 10 ? ['Breakfast', 'Lunch', 'Dinner'] : h < 14 ? ['Lunch', 'Dinner', 'Breakfast'] : ['Dinner', 'Lunch', 'Breakfast'];
    for (var i = 0; i < order.length; i++) if (get(order[i])) return { label: order[i], text: get(order[i]) };
    return null;
  }

  /* ---------- Family calendar ---------------------------------------------- */
  function monthKey(y, m) { return y + '-' + pad(m + 1); }
  function eventsForMonth(y, m) {
    var mk = monthKey(y, m);
    if (S.calCache[mk]) return S.calCache[mk];
    var hub = (S.data && S.data.events) || [];
    var t = nowParts();
    var inHub = (y === t.y && (m === t.m || m === t.m + 1)) || (y === t.y + 1 && t.m === 11 && m === 0);
    if (inHub) return hub;
    return null;
  }
  function eventsOn(key, list) {
    return (list || []).filter(function (ev) { return ev.startStr <= key && ev.endStr >= key; });
  }
  function todayEvents() { return eventsOn(nowParts().key, (S.data && S.data.events) || []); }
  function cdDate(key) {
    var p = String(key || '').split('-');
    if (p.length !== 3) return '';
    return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
  }
  function cdDays(d) { return d === 0 ? 'Today' : d === 1 ? 'Tomorrow' : d + ' days'; }
  function renderCountdowns() {
    var list = ((S.data && S.data.countdowns) || []).filter(function (c) { return c.daysUntil >= 0; });
    var el = $('countdowns');
    if (!list.length) { el.innerHTML = ''; return; }
    var c = list[0];
    var big = c.daysUntil === 0 ? '<div class="cd-num today">Today!</div>'
      : '<div class="cd-num num">' + c.daysUntil + '<small>' + (c.daysUntil === 1 ? 'day' : 'days') + '</small></div>';
    el.innerHTML = '<div class="cd-main">' + big + '<div style="min-width:0"><div class="cd-label">⏳ Coming up</div><div class="cd-name">' + esc(c.name) + '</div><div class="cd-date">' + esc(cdDate(c.dateStr)) + '</div></div></div>' +
      list.slice(1, 3).map(function (x) {
        return '<div class="cd-next"><b class="num">' + cdDays(x.daysUntil) + '</b><span>' + esc(x.name) + '</span></div>';
      }).join('');
  }
  function countdownsOn(key) { return ((S.data && S.data.countdowns) || []).filter(function (c) { return c.dateStr === key; }); }

  function renderCalendar() {
    var y = S.cal.y, m = S.cal.m;
    $('calTitle').textContent = MONTHS[m] + ' ' + y;
    var list = eventsForMonth(y, m);
    if (!list) {
      list = [];
      loadMonth(y, m);
    }
    var err = (S.data && S.data.calendarError) || S.calErr;
    $('calErr').classList.toggle('hidden', !err);
    $('calErr').textContent = err ? '⚠️ Calendar: ' + err : '';

    var first = new Date(y, m, 1).getDay();
    var days = new Date(y, m + 1, 0).getDate();
    var todayKey = nowParts().key;
    var cells = Math.ceil((first + days) / 7) * 7;
    var html = '';
    for (var i = 0; i < cells; i++) {
      var d = new Date(y, m, 1 - first + i);
      var key = keyOf(d.getFullYear(), d.getMonth(), d.getDate());
      var out = d.getMonth() !== m;
      var evs = eventsOn(key, list);
      var cds = countdownsOn(key);
      var chips = cds.map(function (c) { return '<div class="ev cd">⭐ ' + esc(c.name) + '</div>'; })
        .concat(evs.map(function (ev) {
          return '<div class="ev" style="--evc:' + esc(ev.color || 'var(--accent)') + '">' + (ev.allDay ? '' : esc(ev.timeLabel.replace(':00', '').replace(' ', '').toLowerCase()) + ' ') + esc(ev.title) + '</div>';
        }));
      var shown = chips.slice(0, 3).join('');
      if (chips.length > 3) shown += '<div class="more">+' + (chips.length - 3) + ' more</div>';
      html += '<button class="day' + (out ? ' out' : '') + (key === todayKey ? ' today' : '') + '" data-act="day" data-key="' + key + '">' +
        '<span class="d num">' + d.getDate() + '</span>' + shown + '</button>';
    }
    $('calGrid').innerHTML = html;
    $('calGrid').style.gridTemplateRows = 'repeat(' + (cells / 7) + ', 1fr)';
  }

  function loadMonth(y, m) {
    var mk = monthKey(y, m);
    if (S.calCache[mk] || S['loading' + mk]) return;
    S['loading' + mk] = true;
    call('getFamilyCalendarMonth', y, m).then(function (r) {
      S.calCache[mk] = r.events || [];
      S.calErr = r.error || null;
      if (S.view === 'home' && S.cal.y === y && S.cal.m === m) renderCalendar();
    }).catch(fail).then(function () { S['loading' + mk] = false; });
  }

  function openDay(key) {

  /* ==========================================================================
     PIN PAD (kids auto-submit at 4 digits; parents press Enter)
     ========================================================================== */
  var PIN = null;
  function openPin(opts) {
    PIN = { value: '', opts: opts, busy: false };
    var who = opts.user ? avatar(opts.user, userIndex(opts.user.name)) : '<div class="avatar" style="--kid:var(--accent)">' + (isPic(settings().adminPicture) ? img(settings().adminPicture) : '⚙️') + '</div>';
    openModal('<div class="pin-who">' + who + '<h2>' + esc(opts.title) + '</h2></div>' +
      '<div class="pin-dots" id="pinDots"></div><div class="pin-msg" id="pinMsg">' + esc(opts.hint || 'Enter your PIN') + '</div>' +
      '<div class="pinpad">' + [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (d) { return '<button data-act="pinKey" data-k="' + d + '">' + d + '</button>'; }).join('') +
      '<button class="alt" data-act="pinKey" data-k="back">⌫</button><button data-act="pinKey" data-k="0">0</button>' +
      (opts.enter ? '<button class="alt" data-act="pinKey" data-k="enter" style="background:var(--accent);color:var(--accent-ink)">Enter</button>' : '<button class="alt" data-act="closeModal">Cancel</button>') +
      '</div>' + (opts.enter ? '<div class="sheet-actions"><button class="btn ghost" data-act="closeModal">Cancel</button></div>' : ''), { narrow: true, onClose: function () { PIN = null; } });
    drawPin();
  }
  function drawPin() {
    if (!PIN) return;
    var len = Math.max(4, PIN.value.length);
    var dots = '';
    for (var i = 0; i < len; i++) dots += '<i class="' + (i < PIN.value.length ? 'on' : '') + '"></i>';
    $('pinDots').innerHTML = dots;
  }
  function pinKey(k) {
    if (!PIN || PIN.busy) return;
    if (k === 'back') PIN.value = PIN.value.slice(0, -1);
    else if (k === 'enter') { if (PIN.value) submitPin(); return; }
    else if (PIN.value.length < 8) PIN.value += k;
    drawPin();
    if (!PIN.opts.enter && PIN.value.length === 4) submitPin();
  }
  function submitPin() {
    var p = PIN;
    p.busy = true;
    $('pinMsg').className = 'pin-msg';
    $('pinMsg').textContent = 'Checking…';
    p.opts.submit(p.value).then(function () {
      if (PIN === p) closeModal();
    }).catch(function (e) {
      if (PIN !== p) return;
      p.busy = false; p.value = '';
      drawPin();
      $('pinDots').classList.remove('shake'); void $('pinDots').offsetWidth; $('pinDots').classList.add('shake');
      $('pinMsg').className = 'pin-msg err';
      $('pinMsg').textContent = e.message;
    });
  }
  document.addEventListener('keydown', function (e) {
    if (!PIN) return;

    else if (e.key === 'Backspace') { e.preventDefault(); pinKey('back'); }
    else if (e.key === 'Enter') { e.preventDefault(); pinKey('enter'); if (!PIN.opts.enter && PIN.value.length) submitPin(); }

  function openKid(name) {
    var u = users()[userIndex(name)];
    if (!u) return;
    var enter = function (r) {
      S.kid = name; S.kidPin = r.pin; S.kidTab = 'chores'; S.queued = {}; S.sending = {};

  /* ---------- optimistic chore taps, batched to completeChores ------------- */
  function tapChore(id, el) {

    if (st === 'upcoming') return toast(c.availabilityLabel + '.');
    if (st === 'expired') return toast('This one closed at ' + c.closes + '.');

    var u = currentKid();

    var at = Math.min.apply(null, ids.map(function (id) { return (S.tapAt && S.tapAt[id]) || Date.now(); }));

      queueOp('completeChores', [kid, ids], kid + ': ' + ids.length + ' chore' + (ids.length === 1 ? '' : 's'), at);
      var ku = users()[userIndex(kid)];

    call('completeChores', kid, ids).then(function (r) {

        else if (r.dayJustCompleted) celebrate('🔥', nu.streak + '-day streak!', 'Every chore done for today. Rewards and quests are unlocked.');
      }

    }).catch(function (e) {
      if (e && e.network) { keepForLater(); toast('No internet — saved on the kiosk, will send later'); return; }

  /* ==========================================================================
     LISTS (inventory: out of stock = needed)

  var listCat = null;
  function renderLists() {
    var lists = S.data && S.data.lists;
    var pane = $('listsPane');
    if (!lists) { pane.innerHTML = '<div class="empty">Loading…</div>'; return; }
    if (!lists.found) { pane.innerHTML = '<div class="empty">Add a "Lists" tab to the spreadsheet to use household lists.</div>'; return; }
    var cats = lists.lists.map(function (l) { return l.name; });
    if (!listCat || cats.indexOf(listCat) === -1) listCat = cats[0] || 'General';
    var add = '<div class="add-bar"><input class="field" id="newItem" maxlength="80" placeholder="Add something we need…"><div class="seg">' +
      cats.map(function (c) { return '<button class="' + (c === listCat ? 'on' : '') + '" data-act="listCat" data-v="' + esc(c) + '">' + esc(c) + '</button>'; }).join('') +
      '</div><button class="btn primary" data-act="addItem">Add</button></div>';
    var cols = '<div class="list-cols">' + lists.lists.map(function (l) {
      var items = l.items.slice().sort(function (a, b) { return (a.needed === b.needed) ? 0 : a.needed ? -1 : 1; });
      return '<div class="list-card"><h3>' + esc(l.name) + (l.neededCount ? '<span class="chip" style="color:var(--warn)">' + l.neededCount + ' needed</span>' : '<span class="chip">All stocked</span>') + '</h3>' +
        (items.length ? items.map(function (it) {
          var key = it.ref.row + ':' + (it.ref.col || '');
          var sel = !!S.listSel[key];
          return '<div class="item ' + (it.needed ? 'need' : 'have') + (sel ? ' sel' : '') + '" data-act="item" data-key="' + key + '"><span class="box">' + (sel ? '✓' : '') + '</span><span class="name">' + esc(it.text) + '</span>' +
            '<span class="faint" style="font-size:14px">' + (it.needed ? (sel ? 'Got it' : 'Need') : 'Have') + '</span><button class="x" data-act="delItem" data-key="' + key + '" aria-label="Delete ' + esc(it.text) + '">✕</button></div>';
        }).join('') : '<div class="muted" style="padding:8px">Empty</div>') + '</div>';
    }).join('') + '</div>';
    pane.innerHTML = '<p class="muted" style="margin:0 0 14px">Tap what you bought, then mark it in stock. Tap something we have to put it back on the list.</p>' + add + cols;
    var input = $('newItem');
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') addItem(); });
    renderListsDock();
  }
  function findItem(key) {
    var found = null;
    (S.data.lists.lists || []).forEach(function (l) { l.items.forEach(function (it) { if (it.ref.row + ':' + (it.ref.col || '') === key) found = it; }); });
    return found;
  }
  function renderListsDock() {
    var keys = Object.keys(S.listSel);
    var dock = $('listsDock');
    dock.classList.toggle('hidden', !keys.length);
    if (keys.length) dock.innerHTML = '<span class="grow">' + keys.length + ' item' + (keys.length === 1 ? '' : 's') + ' bought</span><button class="btn" data-act="listClear">Clear</button><button class="btn primary" data-act="restock">Mark in stock</button>';
  }
  function tapItem(key) {
    var it = findItem(key);
    if (!it) return;
    if (it.needed) {
      if (S.listSel[key]) delete S.listSel[key]; else S.listSel[key] = true;
      renderLists();
      return;
    }
    if (it.ref && it.ref.row < 0) return toast('Still saving this item…');
    it.needed = true; it.done = false; it.status = 'Out of Stock'; // optimistic
    renderLists();
    listCall('setListItemDone', [it.ref, false, it.text], it.text).then(function (r) { if (r) S.data.lists = r.lists; persist(); if (S.view === 'lists') renderLists(); }).catch(function (e) { fail(e); refresh(); });
  }
  function restock() {
    var items = Object.keys(S.listSel).map(findItem).filter(function (it) { return it && !(it.ref && it.ref.row < 0); });
    S.listSel = {};
    items.forEach(function (it) { it.needed = false; it.done = true; it.status = 'In Stock'; });
    renderLists();
    listCall('markListItemsInStock', [items.map(function (it) { return { ref: it.ref, text: it.text }; })], items.length + ' items in stock').then(function (r) {
      if (r) S.data.lists = r.lists;
      persist(); if (S.view === 'lists') renderLists();
      toast(items.length + ' item' + (items.length === 1 ? '' : 's') + ' marked in stock');
    }).catch(function (e) { fail(e); refresh(); });
  }
  function addItem() {
    var input = $('newItem');
    var text = (input.value || '').trim();
    if (!text) { toast('Type what we need first.', true); return; }
    input.value = '';
    var list = S.data.lists.lists.filter(function (l) { return l.name === listCat; })[0];
    if (list) { list.items.unshift({ ref: { row: -Date.now() }, text: text, needed: true, done: false, status: 'Out of Stock' }); list.neededCount++; }
    renderLists();
    listCall('addListItem', [listCat, text], 'add ' + text).then(function (r) { if (r) S.data.lists = r.lists; persist(); if (S.view === 'lists') renderLists(); toast(r ? 'Added ' + text : 'Saved on the kiosk — will add when online'); })
      .catch(function (e) { fail(e); refresh(); });
  }
  function deleteItem(key) {
    var it = findItem(key);
    if (!it) return;
    confirmBox('Delete “' + it.text + '”?', 'It will be removed from the list completely.', 'Delete', function () {
      if (it.ref && it.ref.row < 0) { toast('Still saving this item…'); return; }
      delete S.listSel[key];
      S.data.lists.lists.forEach(function (l) { var i = l.items.indexOf(it); if (i !== -1) { l.items.splice(i, 1); if (it.needed) l.neededCount--; } });
      renderLists();
      listCall('removeListItem', [it.ref, it.text], 'delete ' + it.text).then(function (r) { if (r) S.data.lists = r.lists; persist(); renderLists(); toast('Deleted ' + it.text); }).catch(function (e) { fail(e); refresh(); });
    }, true);
  }

    },
    alTest: function (el) { startAlarmSound(el.dataset.sound, false, 4000); }
  });

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var fn = ACT[el.dataset.act];
    if (fn) fn(el, e);
  });
  $('modal').addEventListener('click', function (e) {
    if (e.target === $('modal') && !$('modal').dataset.sticky) closeModal();
  });
  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'thArea') { TH.area = e.target.value; renderAdmin(); }
  });
  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'cdName') CD_NAME = e.target.value;
    var el = e.target;
    if (!el.dataset || !el.dataset.q || S.view !== 'admin') return;
    if (el.dataset.q === 'setting') {
      var k = el.dataset.k;
      var orig = S.admin.settings[k];
      if (String(orig === undefined || orig === null ? '' : orig) === el.value) delete S.q.settings[k]; else S.q.settings[k] = el.value;
    } else if (el.dataset.q === 'meal') {
      var mt = el.dataset.meal, d = el.dataset.day;
      S.q.meals[mt] = S.q.meals[mt] || {};
      S.q.meals[mt][d] = el.value;
    }
    el.classList.add('queued');
    renderAdminDock();
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (!el.dataset || el.dataset.q !== 'override') return;
    if (el.value) S.q.overrides[el.dataset.kid] = el.value; else delete S.q.overrides[el.dataset.kid];
    renderAdmin();
  });

  boot();
})();
</script>
</body>
</html>
