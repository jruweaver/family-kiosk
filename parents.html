<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Parents</title>
  <script>
  /* Self-hosted mode: when this page is NOT served by Apps Script, google.script.run
     is replaced by calls to the web app (doPost) using the pairing key saved on
     this device. Inside Apps Script this block does nothing. */
  (function () {
    if (window.google && window.google.script && window.google.script.run) return;
    var CFG_KEY = 'fcc.api.v1';
    window.FCC_SELF_HOSTED = true;
    function readCfg() { try { return JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); } catch (e) { return null; } }
    function saveCfg(c) { try { localStorage.setItem(CFG_KEY, JSON.stringify(c)); } catch (e) { /* private mode */ } }
    // A pairing link (?api=…&key=…) is saved once and removed from the address bar.
    try {
      var q = new URLSearchParams(location.search);
      if (q.get('api') && q.get('key')) {
        saveCfg({ url: q.get('api').trim(), key: q.get('key').trim() });
        q.delete('api'); q.delete('key');
        var rest = q.toString();
        history.replaceState(null, '', location.pathname + (rest ? '?' + rest : '') + location.hash);
      }
    } catch (e) { /* old browser */ }

    function post(fn, args) {
      var cfg = readCfg();
      if (!cfg || !cfg.url || !cfg.key) { showSetup(); return Promise.reject(new Error('This device is not paired yet.')); }
      var ctl = window.AbortController ? new AbortController() : null;
      var timer = ctl ? setTimeout(function () { ctl.abort(); }, 90000) : null;
      return fetch(cfg.url, {
        method: 'POST', redirect: 'follow', credentials: 'omit',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // "simple" request: no CORS preflight
        body: JSON.stringify({ fn: fn, args: args, key: cfg.key }),
        signal: ctl ? ctl.signal : undefined
      }).then(function (res) {
        if (timer) clearTimeout(timer);
        if (!res.ok) throw new Error('NetworkError: HTTP ' + res.status);
        return res.text();
      }).then(function (text) {
        var out;
        try { out = JSON.parse(text); } catch (e) {
          // A Google sign-in page instead of JSON = the web app isn't shared with "Anyone".
          throw new Error('The web app answered with a web page instead of data. Check Deploy ▸ Manage deployments: Execute as "Me", Who has access "Anyone".');
        }
        if (out && (out.code === 'BAD_KEY' || out.code === 'NO_KEY')) showSetup(out.error);
        else markConnected();
        return out;
      }, function (err) {
        if (timer) clearTimeout(timer);
        var why = (err && err.message) || 'Connection failure';
        // Never connected on this device and the browser can't reach it at all: almost always
        // the deployment settings or the link, not the internet. Show the fix instead of looping.
        if (!wasConnected() && navigator.onLine !== false) {
          showSetup('Could not reach the web app (' + why + '). Check: 1) the link ends in /exec (not /dev); ' +
            '2) Deploy ▸ Manage deployments ▸ Execute as "Me", Who has access "Anyone"; 3) you chose Version: New version and clicked Deploy.');
        }
        throw new Error('NetworkError: ' + why);
      });
    }
    function wasConnected() { try { return localStorage.getItem('fcc.api.ok') === '1'; } catch (e) { return false; } }
    function markConnected() { try { localStorage.setItem('fcc.api.ok', '1'); } catch (e) { /* ignore */ } }

    function runner() {
      var h = {};
      return new Proxy({}, { get: function (_, name) {
        if (name === 'withSuccessHandler') return function (f) { h.s = f; return this; };
        if (name === 'withFailureHandler') return function (f) { h.f = f; return this; };
        if (name === 'withUserObject') return function () { return this; };
        return function () {
          var args = Array.prototype.slice.call(arguments);
          post(String(name), args).then(function (r) { if (h.s) h.s(r); }, function (e) { if (h.f) h.f(e); });
        };
      } });
    }
    window.google = window.google || {};
    window.google.script = {};
    Object.defineProperty(window.google.script, 'run', { get: runner });

    /* ---------- pairing screen ---------- */
    var setupShown = false;
    function showSetup(msg) {
      if (setupShown) return;
      setupShown = true;
      var go = function () {
        var cfg = readCfg() || {};
        var box = document.createElement('div');
        box.id = 'fccSetup';
        box.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#111317;color:#ECEEF2;display:flex;align-items:center;justify-content:center;padding:20px;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
        box.innerHTML = '<div style="width:100%;max-width:520px">' +
          '<h1 style="margin:0 0 6px;font-size:26px">Connect this device</h1>' +
          '<p style="margin:0 0 16px;color:#9AA2B1">Paste the web app link and pairing key from the script editor (run <b>setupSelfHosting</b>), or open the pairing link it printed.</p>' +
          (msg ? '<p style="margin:0 0 14px;color:#F06A72;font-weight:700;line-height:1.35"></p>' : '') +
          '<label style="display:block;color:#9AA2B1;font-size:14px;margin:8px 0 4px">Web app link (ends in /exec)</label>' +
          '<input id="fccUrl" style="width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #2B3039;background:#1B1E24;color:inherit;font:inherit" placeholder="https://script.google.com/macros/s/…/exec">' +
          '<label style="display:block;color:#9AA2B1;font-size:14px;margin:12px 0 4px">Pairing key</label>' +
          '<input id="fccKey" style="width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #2B3039;background:#1B1E24;color:inherit;font:inherit" autocomplete="off">' +
          '<button id="fccSave" style="margin-top:16px;width:100%;padding:14px;border:0;border-radius:10px;background:#5B8DF5;color:#0B1220;font:700 17px system-ui,sans-serif">Connect</button>' +
          '<p id="fccMsg" style="min-height:22px;margin:10px 0 0;color:#9AA2B1"></p></div>';
        document.body.appendChild(box);
        if (msg) box.querySelector('p[style*="F06A72"]').textContent = msg;
        document.getElementById('fccUrl').value = cfg.url || '';
        document.getElementById('fccKey').value = cfg.key || '';
        document.getElementById('fccSave').onclick = function () {
          var url = document.getElementById('fccUrl').value.trim(), key = document.getElementById('fccKey').value.trim();
          var m = document.getElementById('fccMsg');
          if (/\/dev(\?|$)/.test(url)) { m.textContent = 'That is the test link (/dev). Use the Web app URL ending in /exec from Deploy ▸ Manage deployments.'; return; }
          if (!/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec/.test(url)) { m.textContent = 'That doesn\'t look like a web app link ending in /exec.'; return; }
          if (!key) { m.textContent = 'Enter the pairing key.'; return; }
          m.textContent = 'Checking…';
          saveCfg({ url: url, key: key });
          post('ping', []).then(function (r) {
            if (r && r.ok && r.pong) { m.textContent = 'Connected!'; setTimeout(function () { location.reload(); }, 400); }
            else m.textContent = (r && r.error) || 'That didn\'t work.';
          }, function (e) { m.textContent = e.message.replace(/^NetworkError: /, 'Could not reach it: '); });
        };
      };
      if (document.body) go(); else document.addEventListener('DOMContentLoaded', go);
    }
    var saved = readCfg();
    if (!saved) showSetup();
    else if (/\/dev(\?|$)/.test(saved.url || '')) showSetup('This device was paired with the test link (/dev), which only works for you in the script editor. Paste the Web app URL ending in /exec.');

    /* ---------- app-like extras only possible outside Google's frame ---------- */
    document.addEventListener('DOMContentLoaded', function () {
      var mf = document.createElement('link');
      mf.rel = 'manifest';
      mf.href = /parents/i.test(location.pathname) ? 'parents.webmanifest' : 'manifest.webmanifest';
      document.head.appendChild(mf);
    });
    // Keep the kiosk screen on (not on the phone page).
    if (!/parents/i.test(location.pathname) && navigator.wakeLock) {
      var wake = null;
      var lock = function () {
        if (document.visibilityState !== 'visible' || (wake && !wake.released)) return;
        navigator.wakeLock.request('screen').then(function (l) { wake = l; }, function () { /* not allowed right now */ });
      };
      document.addEventListener('visibilitychange', lock);
      window.addEventListener('load', lock);
      document.addEventListener('pointerdown', lock, { passive: true });
    }
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* offline start not available */ }); });
    }
  })();
  </script>
  <style>
    :root {
      --bg: #F4F5F7; --card: #FFFFFF; --line: #E2E5EA; --text: #16191F; --muted: #646B78;
      --accent: #2F6FEB; --accent-text: #FFFFFF; --ok: #1E8E4E; --warn: #B26A00; --bad: #C8323C; --chip: #EEF1F5;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111317; --card: #1B1E24; --line: #2B3039; --text: #ECEEF2; --muted: #9AA2B1;
        --accent: #5B8DF5; --accent-text: #0B1220; --ok: #4CC47F; --warn: #E3A440; --bad: #F06A72; --chip: #252A33; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body { font: 16px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }
    header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: var(--bg); border-bottom: 1px solid var(--line); }
    header h1 { flex: 1; margin: 0; font-size: 20px; }
    main { padding: 12px; max-width: 640px; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .card h2 { margin: 0 0 4px; font-size: 18px; }
    .card h3 { margin: 14px 0 6px; font-size: 15px; color: var(--muted); }
    .row { display: flex; align-items: center; gap: 8px; }
    .row.wrap { flex-wrap: wrap; }
    .grow { flex: 1; min-width: 0; }
    .muted { color: var(--muted); font-size: 14px; }
    .btn { min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--chip); font-weight: 600; white-space: nowrap; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    .btn.bad { color: var(--bad); }
    .btn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    .btn:disabled { opacity: .5; }
    .btn.sm { min-height: 34px; padding: 0 10px; font-size: 14px; }
    input.f, select.f, textarea.f { width: 100%; min-height: 42px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
    textarea.f { min-height: 80px; resize: vertical; }
    label.l { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
    .stats { display: flex; gap: 14px; font-size: 14px; color: var(--muted); margin: 2px 0 8px; }
    .stats b { color: var(--text); }
    .line { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-top: 1px solid var(--line); }
    .line:first-child { border-top: 0; }
    .tag { font-size: 12px; padding: 2px 7px; border-radius: 999px; background: var(--chip); color: var(--muted); }
    .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .seg button { border: 0; background: var(--card); padding: 7px 12px; font-size: 14px; font-weight: 600; }
    .seg button.on { background: var(--accent); color: var(--accent-text); }
    .card.ai { border: 2px solid color-mix(in srgb, var(--accent) 40%, transparent); }
    label.chk { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--line); }
    label.chk:first-child { border-top: 0; }
    label.chk input { width: 22px; height: 22px; margin: 0; flex: none; accent-color: var(--accent); }
    nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 5; display: flex; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
    nav button { flex: 1; border: 0; background: none; padding: 10px 0 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
    nav button.on { color: var(--accent); }
    nav button span { display: block; font-size: 20px; }
    #toast { position: fixed; left: 12px; right: 12px; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 9; padding: 12px 14px; border-radius: 10px; background: var(--text); color: var(--bg); font-weight: 600; display: none; }
    #toast.err { background: var(--bad); color: #fff; }
    #busy { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: var(--accent); z-index: 9; display: none; }
    .login { max-width: 360px; margin: 18vh auto 0; padding: 0 16px; }
    .login h1 { font-size: 24px; margin: 0 0 14px; }
    .item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
    .item:first-of-type { border-top: 0; }
    .item .name { flex: 1; }
    .item.have .name { color: var(--muted); }
    .x { border: 0; background: none; color: var(--muted); font-size: 20px; width: 34px; height: 34px; }
    .empty { color: var(--muted); padding: 6px 0; }
  </style>
</head>
<body>
  <div id="busy"></div>

  <div id="loginView" class="login">
    <h1>Parents</h1>
    <label class="l" for="pin">Parent PIN</label>
    <input class="f" id="pin" type="password" inputmode="numeric" autocomplete="current-password">
    <label class="row" style="margin:12px 0"><input type="checkbox" id="remember"> Stay signed in on this phone</label>
    <button class="btn primary" style="width:100%" id="loginBtn">Sign in</button>
    <p class="muted" id="loginMsg"></p>
  </div>

  <div id="appView" class="hidden">
    <header><h1 id="title">Kids</h1><button class="btn sm" data-act="reload">Refresh</button><button class="btn sm" data-act="signout">Sign out</button></header>
    <main id="main"></main>
    <nav>
      <button data-tab="kids"><span>👧</span>Kids</button>
      <button data-tab="lists"><span>🛒</span>Lists</button>
      <button data-tab="meals"><span>🍽️</span>Meals</button>
      <button data-tab="quests"><span>🔥</span>Quests</button>
      <button data-tab="tasks"><span>🕒</span>Tasks</button>
      <button data-tab="more"><span>📌</span>More</button>
    </nav>
  </div>
  <div id="toast"></div>

<script>
(function () {
  'use strict';
  var KEY = 'fcc.parents.pin';
  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var S = { pin: '', admin: null, lists: null, tab: 'kids', listCat: '', busy: 0 };

  /* ---------- helpers ---------- */
  function $(id) { return document.getElementById(id); }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function num(v) { return Number(v || 0).toLocaleString('en-US'); }
  var toastTimer;
  function toast(msg, err) {
    var t = $('toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.style.display = 'none'; }, err ? 5000 : 2200);
  }
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    S.busy++; $('busy').style.display = 'block';
    return new Promise(function (resolve, reject) {
      function done() { if (--S.busy <= 0) { S.busy = 0; $('busy').style.display = 'none'; } }
      var r = google.script.run
        .withSuccessHandler(function (res) { done(); if (res && res.ok === false) reject(new Error(res.error)); else resolve(res); })
        .withFailureHandler(function (e) { done(); reject(new Error((e && e.message) || 'Could not reach Google. Check your connection.')); });
      r[fn].apply(r, args);
    });
  }
  /** Admin call: PIN first; the response carries the refreshed admin data. */
  function admin(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return call.apply(null, [fn, S.pin].concat(args)).then(function (res) {
      if (res && res.admin) { S.admin = res.admin; if (res.admin.timers) setTimers(res.admin.timers); }
      render();
      return res;
    });
  }
  function fail(e) {
    toast(e.message, true);
    if (/admin PIN|Too many/i.test(e.message)) signOut();
  }
  function todayKey(offset) {
    var d = new Date(); d.setDate(d.getDate() + (offset || 0));
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }

  /* ---------- sign in ---------- */
  function signIn(pin, quiet) {
    $('loginBtn').disabled = true; $('loginMsg').textContent = quiet ? 'Signing in…' : '';
    call('verifyAdminPin', pin).then(function (res) {
      S.pin = pin; S.admin = res.admin;
      try {
        if ($('remember').checked || quiet) localStorage.setItem(KEY, pin); else sessionStorage.setItem(KEY, pin);
      } catch (e) { /* private mode */ }
      $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden');
      render();
    }).catch(function (e) {
      $('loginMsg').textContent = e.message;
      try { localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); } catch (x) { /* ignore */ }
    }).then(function () { $('loginBtn').disabled = false; });
  }
  function signOut() {
    try { localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); } catch (e) { /* ignore */ }
    S.pin = ''; S.admin = null; $('pin').value = '';
    $('appView').classList.add('hidden'); $('loginView').classList.remove('hidden');
  }
  $('loginBtn').onclick = function () { var p = $('pin').value.trim(); if (p) signIn(p); };
  $('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('loginBtn').click(); });

  /* ---------- tabs ---------- */
  function render() {
    var titles = { kids: 'Kids', lists: 'Lists', meals: 'Meals', quests: 'Urgent quests', tasks: 'Task history', more: 'More' };
    $('title').textContent = titles[S.tab];
    Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) { b.classList.toggle('on', b.dataset.tab === S.tab); });
    var m = $('main');
    if (S.tab === 'kids') m.innerHTML = kidsHtml();
    else if (S.tab === 'lists') listsRender();
    else if (S.tab === 'meals') m.innerHTML = mealsHtml();
    else if (S.tab === 'quests') m.innerHTML = questsHtml();
    else if (S.tab === 'tasks') m.innerHTML = tasksHtml();
    else m.innerHTML = moreHtml();
  }

  /* ---------- AI helpers (Quick add, suggestions, meal & quest ideas) ---------- */
  var AI = { qaText: '', qa: null, mealReq: '', meals: null, mealNote: '', shop: null, questReq: '', quests: null };
  function aiOn(k) { var a = S.admin; return !!(a && a.ai && a.ai.configured && a.ai.features && a.ai.features[k]); }
  function aiChecks(list, kind, label) {
    return list.map(function (x, i) {
      var off = !!x.problem || x.status === 'needed';
      var sub = x.problem ? '<div class="warn">' + esc(x.problem) + '</div>'
        : x.status === 'needed' ? '<div class="muted">Already on the list</div>'
          : x.status === 'have' ? '<div class="muted">In stock. Check to mark it needed.</div>'
            : x.current !== undefined ? '<div class="muted">was: ' + esc(x.current || '(blank)') + '</div>' : '';
      return '<label class="chk"><input type="checkbox" data-ai="' + kind + '" data-i="' + i + '"' + (x._on && !off ? ' checked' : '') + (off ? ' disabled' : '') + '>' +
        '<div class="grow">' + esc(x.summary) + (x.forMeals ? '<div class="muted">for ' + esc(x.forMeals) + '</div>' : '') + sub + '</div></label>';
    }).join('') + '<button class="btn primary" style="width:100%;margin-top:8px" data-act="' + kind + 'Apply">' + esc(label) + '</button>';
  }
  function aiPick(list) { return (list || []).filter(function (x) { return x._on && !x.problem && x.status !== 'needed'; }); }
  function aiApplyList(list, el, done) {
    var pick = aiPick(list);
    if (!pick.length) return toast('Nothing is checked.', true);
    el.disabled = true;
    admin('aiApply', pick).then(function (r) {
      var bad = r.results.filter(function (x) { return !x.ok; });
      done(); S.lists = null; render();
      toast(bad.length ? (r.results.length - bad.length) + ' done · ' + bad.length + ' failed: ' + bad[0].error : 'Done: ' + r.results.length + ' change' + (r.results.length === 1 ? '' : 's'), !!bad.length);
    }).catch(function (e) { el.disabled = false; fail(e); });
  }
  function aiKidsTop() {
    var html = '';
    var sg = (S.admin.aiSuggestions && S.admin.aiSuggestions.items) || [];
    if (sg.length) {
      html += '<div class="card ai"><h2>✨ Weekly report suggestions</h2><div class="muted">' + esc(S.admin.aiSuggestions.week) + '</div>' + sg.map(function (x) {
        return '<div class="line" style="align-items:flex-start"><div class="grow"><b>' + esc(x.title) + '</b>' + (x.why ? '<div class="muted">' + esc(x.why) + '</div>' : '') + '</div>' +
          (x.type === 'tip' ? '<button class="btn sm" data-act="sgDismiss" data-id="' + esc(x.id) + '">Got it</button>'
            : '<div class="row" style="flex-direction:column;gap:6px"><button class="btn sm primary" data-act="sgApply" data-id="' + esc(x.id) + '">Apply</button><button class="btn sm" data-act="sgDismiss" data-id="' + esc(x.id) + '">Dismiss</button></div>') + '</div>';
      }).join('') + '</div>';
    }
    if (aiOn('aiQuickAdd')) {
      html += '<div class="card ai"><h2>✨ Quick add</h2><textarea class="f" id="qaText" maxlength="1200" style="margin-top:8px;min-height:64px" placeholder="Dentist Tuesday 3:30 for Madi, add milk and eggs, Noah +50 coins for helping Grandma">' + esc(AI.qaText) + '</textarea>' +
        '<div class="row" style="margin-top:8px"><button class="btn primary grow" data-act="qaGo">Preview</button>' + (AI.qa ? '<button class="btn" data-act="qaClear">Clear</button>' : '') + '</div>' +
        (AI.qa ? '<div style="margin-top:6px">' + aiChecks(AI.qa, 'qa', 'Apply checked') + '</div>' : '<p class="muted" style="margin:8px 0 0">Nothing changes until you tap Apply.</p>') + '</div>';
    }
    return html;
  }

  /* ---------- Kids ---------- */
  /* ---------- Reward timers ---------- */
  var TM = { list: [], skew: 0 };
  function setTimers(t) { if (t && t.timers) { TM.list = t.timers; TM.skew = (t.now || Date.now()) - Date.now(); } }
  function tmLeft(t) { return t.status === 'running' ? t.endMs - (Date.now() + TM.skew) : t.status === 'done' ? 0 : (t.remainingMs || t.minutes * 60000); }
  function tmState(t) { return t.status === 'running' && tmLeft(t) <= 0 ? 'done' : t.status; }
  function tmFmt(ms) {
    var sec = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), x = sec % 60;
    return (h ? h + ':' + ('0' + m).slice(-2) : m) + ':' + ('0' + x).slice(-2);
  }
  function timersHtml() {
    if (S.admin && S.admin.timers && !TM.list.length && !TM.loaded) { setTimers(S.admin.timers); TM.loaded = true; }
    if (!TM.list.length) return '';
    return '<div class="card ai"><h2>⏱ Timers</h2>' + TM.list.map(function (t) {
      var st = tmState(t), id = esc(t.id);
      return '<div class="line" style="flex-wrap:wrap"><div class="grow"><b>' + esc(t.member) + '</b> · ' + esc(t.reward) +
        '<div><b style="font-size:20px" data-tmr-big="' + id + '">' + (st === 'done' ? 'Time\'s up' : tmFmt(tmLeft(t))) + '</b> <span class="muted">' + (st === 'ready' ? 'not started' : st === 'paused' ? 'paused' : '') + '</span></div></div>' +
        (st === 'ready' ? '<button class="btn sm primary" data-act="tmAct" data-a="start" data-id="' + id + '">Start</button>'
          : st === 'running' ? '<button class="btn sm" data-act="tmAct" data-a="pause" data-id="' + id + '">Pause</button>'
            : st === 'paused' ? '<button class="btn sm primary" data-act="tmAct" data-a="resume" data-id="' + id + '">Resume</button>' : '') +
        '<button class="btn sm" data-act="tmAct" data-a="add" data-id="' + id + '">+5</button>' +
        '<button class="btn sm" data-act="tmAct" data-a="stop" data-id="' + id + '">' + (st === 'done' ? 'Clear' : 'Stop') + '</button></div>';
    }).join('') + '</div>';
  }
  setInterval(function () {
    Array.prototype.forEach.call(document.querySelectorAll('[data-tmr-big]'), function (el) {
      var t = TM.list.filter(function (x) { return x.id === el.dataset.tmrBig; })[0];

  /* ---------- Task history: last done, by whom, missed since ---------- */
  var TH = { tasks: null, area: '', loading: false };
  function tasksHtml() {
    if (!TH.tasks) {
      if (!TH.loading) {
        TH.loading = true;
        call('getTaskHistory', S.pin).then(function (r) { TH.tasks = r.tasks; }).catch(fail)
          .then(function () { TH.loading = false; if (S.tab === 'tasks') render(); });
      }
      return '<div class="empty">Loading…</div>';
    }
    var areas = [];
    TH.tasks.forEach(function (t) { if (areas.indexOf(t.area) === -1) areas.push(t.area); });
    var rank = function (t) { return t.lastDone ? t.lastDone.daysAgo : 1e6; };
    var list = TH.tasks.filter(function (t) { return !TH.area || t.area === TH.area; })
      .sort(function (a, b) { return rank(b) - rank(a) || b.missedSince.length - a.missedSince.length; });
    return '<div class="card"><select class="f" id="thArea"><option value="">All areas — longest since done first</option>' +
      areas.map(function (ar) { return '<option' + (ar === TH.area ? ' selected' : '') + '>' + esc(ar) + '</option>'; }).join('') + '</select></div>' +
      '<div class="card">' + list.map(function (t) {
        var d = t.lastDone ? t.lastDone.daysAgo : null;
        var when = d === null ? 'Never done' : d <= 0 ? 'Today' : d === 1 ? 'Yesterday' : d + ' days ago';
        var cls = d === null || d >= 14 ? 'bad' : d >= 7 ? 'warn' : 'ok';
        var by = {}, order = [];
        t.missedSince.forEach(function (m) { if (!by[m.member]) { by[m.member] = 0; order.push(m.member); } by[m.member]++; });
        return '<div class="line"><div class="grow"><b>' + esc(t.task) + '</b>' + (t.person ? ' <span class="tag">' + esc(t.person) + '\'s</span>' : '') + '<div class="muted">' + esc(t.area) + (t.days ? ' · ' + esc(t.days) + ' only' : '') + '</div>' +
          (order.length ? '<div class="muted">Missed since: ' + order.map(function (w) { return '<b class="bad">' + esc(w) + (by[w] > 1 ? ' ×' + by[w] : '') + '</b>'; }).join(', ') + '</div>' : '') +
          '</div><div style="text-align:right"><b class="' + cls + '">' + when + '</b>' +
          (t.lastDone ? '<div class="muted">' + esc(t.lastDone.member) + ' · ' + esc(t.lastDone.dateLabel) + '</div>' : '') + '</div></div>';
      }).join('') + '</div>';
  }

  /* ---------- photo / sound upload ---------- */
  function pickFile(accept, cb) {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = accept;
    inp.style.cssText = 'position:fixed;left:-9999px;opacity:0';
    document.body.appendChild(inp);
    inp.addEventListener('change', function () { var f = inp.files && inp.files[0]; inp.parentNode && inp.parentNode.removeChild(inp); if (f) cb(f); });
    inp.click();
  }
  function shrinkImage(file, max) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), im = new Image();
      im.onload = function () {
        var sc = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
        var cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(im.naturalWidth * sc)); cv.height = Math.max(1, Math.round(im.naturalHeight * sc));
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        cv.toBlob(function (b) {
          if (b && b.type === 'image/webp') return resolve(b);
          cv.toBlob(function (j) { j ? resolve(j) : reject(new Error('Could not read that picture.')); }, 'image/jpeg', 0.86);
        }, 'image/webp', 0.86);
      };
      im.onerror = function () { URL.revokeObjectURL(url); reject(new Error('Could not read that picture.')); };
      im.src = url;
    });
  }
  function blobToB64(blob) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(String(r.result).split(',')[1] || ''); };
      r.onerror = function () { reject(new Error('Could not read that file.')); };
      r.readAsDataURL(blob);
    });
  }
  function upload(kind, target, done) {
    var sound = kind === 'sound';
    pickFile(sound ? 'audio/*' : 'image/*', function (file) {
      if (sound && file.size > 5 * 1048576) return toast('That sound is too big (5 MB max).', true);
      toast(sound ? 'Uploading sound…' : 'Uploading photo…');
      var blob;
      (sound ? Promise.resolve(file) : shrinkImage(file, 600)).then(function (b) { blob = b; return blobToB64(b); }).then(function (data) {
        return admin('adminUploadMedia', { kind: kind, target: target || '', name: (file.name || kind).replace(/\.[a-z0-9]+$/i, ''), mime: blob.type || file.type, data: data });
      }).then(function (r) { toast(sound ? 'Sound added' : 'Photo saved'); if (done) done(r); }).catch(fail);
    });
  }

        toast('Approved: ' + r.member + ' — ' + r.reward + (r.timer ? (r.timer.status === 'running' ? ' · timer started' : ' · timer ready') : ''));
        if (r.timer) call('getTimers').then(function (t) { setTimers(t); render(); });
      }).catch(function (e) { el.disabled = false; fail(e); });
    },
    tmAct: function (el) {
      el.disabled = true;
      call('adminTimer', S.pin, el.dataset.id, el.dataset.a, 5).then(function (r) { setTimers(r); render(); }).catch(function (e) { el.disabled = false; fail(e); });
    },
    rwDeny: function (el) {
      if (!confirm('Deny ' + el.dataset.r + ' for ' + el.dataset.kid + '? Their ' + el.dataset.c + ' coins (and any tickets) go back. This can\'t be undone.')) return;
      el.disabled = true;
      admin('adminDecideReward', el.dataset.id, 'deny').then(function (r) { toast('Denied — ' + r.refund.coins + ' coins back to ' + r.member); }).catch(function (e) { el.disabled = false; fail(e); });
    },
    rwUndo: function (el) {
      el.disabled = true;
      admin('adminDecideReward', el.dataset.id, 'pending').then(function () { toast('Moved back to waiting'); }).catch(function (e) { el.disabled = false; fail(e); });
    },
    given: function (el) {
      admin('adminSetRewardFulfilled', el.dataset.id, el.dataset.v === '1').then(function () { toast(el.dataset.v === '1' ? 'Marked given' : 'Moved back to owed'); }).catch(fail);
    },
    photo: function (el) { upload('profile', S.admin.adminUserStats[el.dataset.i].name); },
    alNew: function () { S.alEdit = ''; render(); },
    alEditP: function (el) { S.alEdit = el.dataset.id; render(); },
    alCancel: function () { delete S.alEdit; render(); },
    alDay: function (el) { el.classList.toggle('on'); },
    alOn: function (el) { admin('adminSetAlarmEnabled', el.dataset.id, el.dataset.v === '1').then(function () { toast(el.dataset.v === '1' ? 'Alarm on' : 'Alarm off'); }).catch(fail); },
    alUpload: function () {
      var keep = alarmDraft();
      upload('sound', '', function (r) {
        S.alDraft = keep;
        if (r.media) keep.sound = r.media.ref;
        render();
        restoreDraft();
      });
    },
    alSave: function (el) {
      var a = alarmDraft();
      if (!a.days.length && !a.date) return toast('Pick days, or one date.', true);
      el.disabled = true;
      admin('adminSaveAlarm', a).then(function () { delete S.alEdit; render(); toast('Alarm saved'); }).catch(function (e) { el.disabled = false; fail(e); });
    },
    alDelete: function (el) {
      if (!confirm('Delete "' + el.dataset.n + '"?')) return;
      admin('adminDeleteAlarm', el.dataset.id).then(function () { delete S.alEdit; render(); toast('Alarm deleted'); }).catch(fail);
    }
  };
  function alarmDraft() {
    var h = Number($('alH').value) % 12 + ($('alAP').value === 'PM' ? 12 : 0);
    return {
      id: S.alEdit || '', name: $('alName').value.trim() || 'Alarm', minutes: h * 60 + Number($('alM').value),
      days: Array.prototype.filter.call($('alDays').children, function (b) { return b.classList.contains('on'); }).map(function (b) { return Number(b.dataset.v); }),
      date: $('alDate').value, who: $('alWho').value, sound: $('alSound').value, message: $('alMsg').value.trim(),
      speak: $('alSpeak').checked, snooze: Number($('alSnooze').value),
      enabled: ((S.admin.alarms || []).filter(function (x) { return x.id === S.alEdit; })[0] || { enabled: true }).enabled
    };
  }
  function restoreDraft() {
    var d = S.alDraft; delete S.alDraft;
    if (!d || !$('alName')) return;
    $('alName').value = d.name; $('alMsg').value = d.message; $('alDate').value = d.date; $('alWho').value = d.who;
    $('alSound').value = d.sound; $('alSpeak').checked = d.speak; $('alSnooze').value = String(d.snooze);
    $('alH').value = String((Math.floor(d.minutes / 60) % 12) || 12); $('alM').value = String(d.minutes % 60); $('alAP').value = d.minutes >= 720 ? 'PM' : 'AM';
    Array.prototype.forEach.call($('alDays').children, function (b) { b.classList.toggle('on', d.days.indexOf(Number(b.dataset.v)) !== -1); });
  }
  document.addEventListener('click', function (e) {
    var tab = e.target.closest('nav button');
    if (tab) { S.tab = tab.dataset.tab; if (S.tab === 'tasks') TH.tasks = null; render(); window.scrollTo(0, 0); return; }
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled || el.tagName === 'SELECT') return;
    var fn = ACT[el.dataset.act];
    if (fn) fn(el, e);
  });
  document.addEventListener('input', function (e) {
    var id = e.target && e.target.id;
    if (id === 'qaText') AI.qaText = e.target.value;
    else if (id === 'aiMealReq') AI.mealReq = e.target.value;
    else if (id === 'aiQuestReq') AI.questReq = e.target.value;
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.id === 'thArea') { TH.area = el.value; render(); return; }
    if (el.dataset && el.dataset.ai) {
      var list = el.dataset.ai === 'qa' ? AI.qa : el.dataset.ai === 'meals' ? AI.meals : AI.shop;
      if (list && list[Number(el.dataset.i)]) list[Number(el.dataset.i)]._on = el.checked;
      return;
    }
    if (el.dataset.act === 'area' && el.value) {
      var u = S.admin.adminUserStats[el.dataset.i];
      el.disabled = true;
      admin('adminOverrideRoom', u.name, el.value).then(function () { toast(u.name + ' → ' + el.value); }).catch(fail);
    }
    if (el.dataset.meal) {
      if (el.value === el.dataset.orig) return;
      var data = {}; data[el.dataset.meal] = {}; data[el.dataset.meal][el.dataset.day] = el.value.trim();
      var keep = el.value;
      call('adminSaveMeals', S.pin, data).then(function (r) {
        el.dataset.orig = keep;
        if (r.admin) S.admin = r.admin;
        toast(el.dataset.day + ' ' + el.dataset.meal.toLowerCase() + ' saved');
      }).catch(fail);
    }
  });

  /* ---------- start ---------- */
  var saved = '';
  try { saved = localStorage.getItem(KEY) || sessionStorage.getItem(KEY) || ''; } catch (e) { /* ignore */ }
  if (saved) { $('remember').checked = !!localStorage.getItem(KEY); signIn(saved, true); }
})();
</script>
</body>
</html>
